[package]
name = "rope"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["tracing"]

[lints]
workspace = true

[lib]
path = "src/rope.rs"
doctest = false

[dependencies.gpui_util]
path = "../gpui_util"

[dependencies.heapless]
version = "0.9.2"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.rayon]
version = "1.8"

[dependencies.sum_tree]
path = "../sum_tree"

[dependencies.unicode-segmentation]
version = "1.10"

[dependencies.ztracing]
path = "../ztracing"

[dependencies.tracing]
version = "0.1.40"

[dev-dependencies.ctor]
version = "1.0.12"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dev-dependencies.util]
path = "../util"
features = ["test-support"]

[dev-dependencies.criterion]
version = "0.8.2"
features = ["html_reports"]

[dev-dependencies.zlog]
path = "../zlog"

[[bench]]
name = "rope_benchmark"
harness = false
