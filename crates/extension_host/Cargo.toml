[package]
name = "extension_host"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["tracing"]

[lints]
workspace = true

[lib]
path = "src/extension_host.rs"
doctest = false

[features]
test-support = []

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-compression]
version = "0.4"
features = ["bzip2", "gzip", "futures-io"]

[dependencies.async-tar]
git = "https://github.com/zed-industries/async-tar"
rev = "bd3ad6f89df9a9da7a8535958756d6bf465936a0"

[dependencies.async-trait]
version = "0.1"

[dependencies.client]
path = "../client"

[dependencies.cloud_api_types]
path = "../cloud_api_types"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.dap]
path = "../dap"

[dependencies.extension]
path = "../extension"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.gpui_tokio]
path = "../gpui_tokio"

[dependencies.http_client]
path = "../http_client"

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.lsp]
path = "../lsp"

[dependencies.moka]
version = "0.12.10"
features = ["sync"]

[dependencies.node_runtime]
path = "../node_runtime"

[dependencies.paths]
path = "../paths"

[dependencies.project]
path = "../project"

[dependencies.remote]
path = "../remote"

[dependencies.release_channel]
path = "../release_channel"

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.serde_json_lenient]
version = "0.2"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.task]
path = "../task"

[dependencies.telemetry]
path = "../telemetry"

[dependencies.tempfile]
version = "3.20.0"

[dependencies.toml]
version = "0.9"
default-features = false
features = ["std", "serde", "parse", "display"]

[dependencies.tracing]
version = "0.1.40"

[dependencies.url]
version = "2.2"

[dependencies.util]
path = "../util"

[dependencies.wasmparser]
version = "0.254"

[dependencies.wasmtime-wasi]
version = "48.0.7"
default-features = false
features = ["p2"]

[dependencies.wasmtime]
version = "48.0.7"
default-features = false
features = ["anyhow", "async", "demangle", "runtime", "cranelift", "component-model", "incremental-cache", "parallel-compilation"]

[dependencies.ztracing]
path = "../ztracing"

[dev-dependencies.criterion]
version = "0.8.2"
features = ["html_reports"]

[dev-dependencies.ctor]
version = "1.0.12"

[dev-dependencies.fs]
path = "../fs"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.language_extension]
path = "../language_extension"

[dev-dependencies.parking_lot]
version = "0.12.1"

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.remote]
path = "../remote"
features = ["test-support"]

[dev-dependencies.reqwest_client]
path = "../reqwest_client"

[dev-dependencies.theme]
path = "../theme"
features = ["test-support"]

[dev-dependencies.theme_settings]
path = "../theme_settings"

[dev-dependencies.theme_extension]
path = "../theme_extension"

[dev-dependencies.zlog]
path = "../zlog"

[[bench]]
name = "extension_compilation_benchmark"
harness = false
