[package]
name = "zeta_prompt"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.publish]
workspace = true

[package.edition]
workspace = true

[lints]
workspace = true

[lib]
path = "src/zeta_prompt.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.imara-diff]
version = "0.2"
default-features = false

[dependencies.serde]
version = "1.0"
features = ["rc", "derive"]

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dev-dependencies.indoc]
version = "2"
