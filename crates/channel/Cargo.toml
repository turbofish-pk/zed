[package]
name = "channel"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/channel.rs"
doctest = false

[features]
test-support = ["collections/test-support", "gpui/test-support", "rpc/test-support"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.client]
path = "../client"

[dependencies.clock]
path = "../clock"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.postage]
version = "0.5"
default-features = false

[dependencies.release_channel]
path = "../release_channel"

[dependencies.rpc]
path = "../rpc"

[dependencies.settings]
path = "../settings"

[dependencies.text]
path = "../text"

[dependencies.util]
path = "../util"

[dev-dependencies.collections]
path = "../collections"
version = "0.1.0"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.rpc]
path = "../rpc"
features = ["test-support"]

[dev-dependencies.client]
path = "../client"
features = ["test-support"]

[dev-dependencies.semver]
version = "1.0"
features = ["serde"]

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]

[dev-dependencies.util]
path = "../util"
features = ["test-support"]

[dev-dependencies.http_client]
path = "../http_client"
features = ["test-support"]
