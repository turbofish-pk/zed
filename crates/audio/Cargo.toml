[package]
name = "audio"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/audio.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.cpal]
git = "https://github.com/RustAudio/cpal"
rev = "e1612d5d98152f8dc2a62e1b51ef7cbf4f7f26b7"

[dependencies.crossbeam-queue]
version = "0.3.12"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.rodio]
git = "https://github.com/RustAudio/rodio"
rev = "3ee9745862279ce1d18db593155016e7ce024aeb"
default-features = false
features = ["wav", "playback", "wav_output", "recording"]

[dependencies.settings]
path = "../settings"

[dependencies.thiserror]
version = "2.0.12"

[dependencies.util]
path = "../util"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[target.'cfg(not(any(all(target_os = "windows", target_env = "gnu"), target_os = "freebsd")))'.dependencies.libwebrtc]
version = "0.3.26"
