[package]
name = "dap_adapters"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[features]


[lints]
workspace = true

[lib]
path = "src/dap_adapters.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-trait]
version = "0.1"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.dap]
path = "../dap"

[dependencies.dotenvy]
version = "0.15.0"

[dependencies.futures]
version = "0.3.34"

[dependencies.fs]
path = "../fs"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.paths]
path = "../paths"

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.smol]
version = "2.0"

[dependencies.task]
path = "../task"

[dependencies.util]
path = "../util"
