[package]
name = "fs"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["async-std"]

[lints]
workspace = true

[lib]
path = "src/fs.rs"
doctest = false

[[test]]
name = "integration"
required-features = ["test-support"]
path = "tests/integration/fs_tests.rs"

[dependencies]
notify = "9.0.0-rc.4"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-channel]
version = "2.5"
default-features = false

[dependencies.async-tar]
git = "https://github.com/zed-industries/async-tar"
rev = "bd3ad6f89df9a9da7a8535958756d6bf465936a0"

[dependencies.async-trait]
version = "0.1"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.futures]
version = "0.3.34"

[dependencies.git]
path = "../git"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.ignore]
version = "0.4.22"

[dependencies.libc]
version = "0.2"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.paths]
path = "../paths"

[dependencies.rope]
path = "../rope"

[dependencies.proto]
path = "../proto"

[dependencies.thiserror]
version = "2.0.12"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.slotmap]
version = "1.0.6"

[dependencies.smol]
version = "2.0"

[dependencies.telemetry]
path = "../telemetry"

[dependencies.tempfile]
version = "3.20.0"

[dependencies.text]
path = "../text"

[dependencies.util]
path = "../util"

[dependencies.trash]
git = "https://github.com/zed-industries/trash-rs"
rev = "41c6c800d884a89351f3b8856d12894cccee261d"

[target."cfg(unix)".dependencies.rustix]
version = "1.1"
features = ["fs"]

[target.'cfg(target_os = "windows")'.dependencies.is_executable]
version = "1.0"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"]

[target.'cfg(target_os = "windows")'.dependencies.dunce]
version = "1.0"

[target.'cfg(target_os = "windows")'.dependencies.async-std]
version = "1.12"
features = ["unstable"]

[target.'cfg(target_os = "macos")'.dependencies]
unicode-normalization = "0.1"

[dev-dependencies.fs]
path = ""
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.git]
path = "../git"
features = ["test-support"]

[features]
test-support = ["gpui/test-support", "git/test-support", "util/test-support"]
