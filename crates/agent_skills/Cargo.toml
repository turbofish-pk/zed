[package]
name = "agent_skills"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "agent_skills.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.base64]
version = "0.22"

[dependencies.const_format]
version = "0.2"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.paths]
path = "../paths"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_yaml_ng]
version = "0.10"

[dependencies.url]
version = "2.2"

[dependencies.util]
path = "../util"

[dev-dependencies.fs]
path = "../fs"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]
