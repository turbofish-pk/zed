[package]
name = "gpui_platform"
version = "0.1.0"
license = "Apache-2.0"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/gpui_platform.rs"
doctest = false

[features]
default = ["multithreaded"]
multithreaded = []
font-kit = []
inspector = ["gpui/inspector"]

wayland = ["gpui_linux/wayland"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.gpui]
path = "../gpui"
default-features = false





[target.'cfg(all(any(target_os = "linux", target_os = "freebsd"), not(target_env = "ohos")))'.dependencies.gpui_linux]
path = "../gpui_linux"
default-features = false

[target.'cfg(target_os = "linux")'.dependencies.gpui_wgpu]
path = "../gpui_wgpu"
optional = true
