[package]
name = "gpui_windows"
version = "0.1.0"
license = "Apache-2.0"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["scap"]

[lints]
workspace = true

[lib]
path = "src/gpui_windows.rs"
doctest = false

[features]
default = ["gpui/default"]
test-support = ["gpui/test-support"]
screen-capture = ["gpui/screen-capture", "scap"]

[dependencies.gpui]
path = "../gpui"
default-features = false

[target.'cfg(target_os = "windows")'.dependencies]
windows-numerics = "0.3"

[target.'cfg(target_os = "windows")'.dependencies.accesskit]
version = "0.24.0"
features = ["enumn"]

[target.'cfg(target_os = "windows")'.dependencies.accesskit_windows]
version = "0.34"

[target.'cfg(target_os = "windows")'.dependencies.anyhow]
version = "1.0.86"

[target.'cfg(target_os = "windows")'.dependencies.collections]
path = "../collections"
version = "0.1.0"

[target.'cfg(target_os = "windows")'.dependencies.dunce]
version = "1.0"

[target.'cfg(target_os = "windows")'.dependencies.etagere]
version = "0.2"

[target.'cfg(target_os = "windows")'.dependencies.futures]
version = "0.3.34"

[target.'cfg(target_os = "windows")'.dependencies.gpui_util]
path = "../gpui_util"

[target.'cfg(target_os = "windows")'.dependencies.image]
version = "0.25.1"
default-features = false
features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"]

[target.'cfg(target_os = "windows")'.dependencies.itertools]
version = "0.14.0"

[target.'cfg(target_os = "windows")'.dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[target.'cfg(target_os = "windows")'.dependencies.parking_lot]
version = "0.12.1"

[target.'cfg(target_os = "windows")'.dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[target.'cfg(target_os = "windows")'.dependencies.raw-window-handle]
version = "0.6"

[target.'cfg(target_os = "windows")'.dependencies.scheduler]
path = "../scheduler"

[target.'cfg(target_os = "windows")'.dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[target.'cfg(target_os = "windows")'.dependencies.uuid]
version = "1.1"
features = ["serde", "v5"]

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Data_Xml_Dom", "UI_Notifications", "UI_ViewManagement", "Wdk_System_SystemServices", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectManipulation", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Hlsl", "Win32_Media", "Win32_Security_Credentials", "Win32_Storage_Packaging_Appx", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_Pointer"]

[target.'cfg(target_os = "windows")'.dependencies.windows-core]
version = "0.62"

[target.'cfg(target_os = "windows")'.dependencies.windows-registry]
version = "0.6.0"

[target.'cfg(target_os = "windows")'.dependencies.scap]
git = "https://github.com/zed-industries/scap"
rev = "b5c86ec58dd4b6b7732bf6ac8be03d6b1f190a82"
default-features = false
package = "zed-scap"
version = "0.0.8-zed"
optional = true

[target.'cfg(target_os = "windows")'.build-dependencies.windows-registry]
version = "0.6.0"
