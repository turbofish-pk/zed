[package]
name = "extension"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["tracing"]

[lints]
workspace = true

[lib]
path = "src/extension.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-trait]
version = "0.1"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.dap]
path = "../dap"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.heck]
version = "0.5"

[dependencies.http_client]
path = "../http_client"

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.lsp]
path = "../lsp"

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.path]
path = "../path"

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]
[dependencies.strum]
version = "0.28"
features = ["derive"]
[dependencies.task]
path = "../task"

[dependencies.toml]
version = "0.9"
default-features = false
features = ["std", "serde", "parse", "display"]

[dependencies.url]
version = "2.2"

[dependencies.util]
path = "../util"

[dependencies.wasm-encoder]
version = "0.254"

[dependencies.wasmparser]
version = "0.254"

[dependencies.which]
version = "8"

[dependencies.ztracing]
path = "../ztracing"
