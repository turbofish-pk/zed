[package]
name = "keymap_editor"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/keymap_editor.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.command_palette]
path = "../command_palette"

[dependencies.db]
path = "../db"

[dependencies.editor]
path = "../editor"

[dependencies.fs]
path = "../fs"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.itertools]
version = "0.14.0"

[dependencies.json_schema_store]
path = "../json_schema_store"

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.menu]
path = "../menu"

[dependencies.notifications]
path = "../notifications"

[dependencies.paths]
path = "../paths"

[dependencies.project]
path = "../project"

[dependencies.search]
path = "../search"

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.telemetry]
path = "../telemetry"

[dependencies.tempfile]
version = "3.20.0"

[dependencies.theme]
path = "../theme"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.tree-sitter-json]
version = "0.24"

[dependencies.tree-sitter-rust]
version = "0.24.2"

[dependencies.ui_input]
path = "../ui_input"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"

[dev-dependencies.db]
path = "../db"
features = ["test-support"]

[dev-dependencies.fs]
path = "../fs"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.workspace]
path = "../workspace"
features = ["test-support"]
