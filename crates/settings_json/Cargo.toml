[package]
name = "settings_json"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/settings_json.rs"
doctest = false

[features]
default = ["editing"]
editing = ["dep:tree-sitter", "dep:tree-sitter-json", "dep:serde_json"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.tree-sitter]
git = "https://github.com/tree-sitter/tree-sitter"
rev = "803c6ebaac27d69e1808b45058482e868d073ceb"
optional = true

[dependencies.tree-sitter-json]
version = "0.24"
optional = true

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]
optional = true

[dependencies.serde_json_lenient]
version = "0.2"
features = ["preserve_order", "raw_value"]

[dependencies.serde_path_to_error]
version = "0.1.17"

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.unindent]
version = "0.2.0"

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]
