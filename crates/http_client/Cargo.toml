[package]
name = "http_client"
version = "0.1.0"
publish = false
license = "Apache-2.0"
description = "A HTTP client library for Zed and GPUI"

[package.edition]
workspace = true

[lints]
workspace = true

[features]
test-support = ["dep:log"]
github-download = ["dep:async-compression", "dep:async-fs", "dep:async-tar", "dep:sha2", "dep:tempfile", "dep:util"]

[lib]
path = "src/http_client.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.bytes]
version = "1.0"

[dependencies.futures]
version = "0.3.34"

[dependencies.http-body]
version = "1.0"

[dependencies.http]
version = "1.1"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]
optional = true

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.serde_urlencoded]
version = "0.7"

[dependencies.url]
version = "2.2"

[target.'cfg(not(target_family = "wasm"))'.dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[target.'cfg(not(target_family = "wasm"))'.dependencies.async-compression]
version = "0.4"
features = ["bzip2", "gzip", "futures-io"]
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.util]
path = "../util"
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.async-fs]
version = "2.1"
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.async-tar]
git = "https://github.com/zed-industries/async-tar"
rev = "bd3ad6f89df9a9da7a8535958756d6bf465936a0"
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.sha2]
version = "0.10"
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.tempfile]
version = "3.20.0"
optional = true
