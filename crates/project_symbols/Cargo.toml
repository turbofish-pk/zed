[package]
name = "project_symbols"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/project_symbols.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.editor]
path = "../editor"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.ordered-float]
version = "5"

[dependencies.picker]
path = "../picker"

[dependencies.picker_preview]
path = "../picker_preview"

[dependencies.project]
path = "../project"

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.theme]
path = "../theme"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dev-dependencies.editor]
path = "../editor"


[dev-dependencies.futures]
version = "0.3.34"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false


[dev-dependencies.language]
path = "../language"


[dev-dependencies.lsp]
path = "../lsp"


[dev-dependencies.project]
path = "../project"


[dev-dependencies.release_channel]
path = "../release_channel"

[dev-dependencies.semver]
version = "1.0"
features = ["serde"]

[dev-dependencies.settings]
path = "../settings"


[dev-dependencies.theme]
path = "../theme"


[dev-dependencies.workspace]
path = "../workspace"
