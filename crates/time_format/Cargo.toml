[package]
name = "time_format"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/time_format.rs"
doctest = false

[dependencies.time]
version = "0.3"
features = ["macros", "parsing", "serde", "serde-well-known", "formatting", "local-offset"]

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies.sys-locale]
version = "0.3.1"
