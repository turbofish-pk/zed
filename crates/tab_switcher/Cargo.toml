[package]
name = "tab_switcher"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/tab_switcher.rs"
doctest = false

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.editor]
path = "../editor"

[dependencies.fuzzy_nucleo]
path = "../fuzzy_nucleo"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.menu]
path = "../menu"

[dependencies.picker]
path = "../picker"

[dependencies.project]
path = "../project"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.settings]
path = "../settings"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dev-dependencies.ctor]
version = "1.0.12"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false


[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.theme]
path = "../theme"


[dev-dependencies.theme_settings]
path = "../theme_settings"

[dev-dependencies.workspace]
path = "../workspace"


[dev-dependencies.zlog]
path = "../zlog"
