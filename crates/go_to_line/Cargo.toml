[package]
name = "go_to_line"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/go_to_line.rs"
doctest = false

[dependencies.editor]
path = "../editor"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language]
path = "../language"

[dependencies.menu]
path = "../menu"

[dependencies.multi_buffer]
path = "../multi_buffer"

[dependencies.settings]
path = "../settings"

[dependencies.text]
path = "../text"

[dependencies.theme]
path = "../theme"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dev-dependencies.editor]
path = "../editor"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.indoc]
version = "2"

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.menu]
path = "../menu"

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.rope]
path = "../rope"

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.workspace]
path = "../workspace"
features = ["test-support"]
