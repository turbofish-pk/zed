[package]
name = "debugger_ui"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/debugger_ui.rs"
doctest = false

[features]
test-support = ["dap/test-support", "dap_adapters/test-support", "debugger_tools/test-support", "editor/test-support", "gpui/test-support", "project/test-support", "util/test-support", "workspace/test-support", "unindent", "dep:command_palette_hooks"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.bitflags]
version = "2.6.0"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.command_palette_hooks]
path = "../command_palette_hooks"
optional = true

[dependencies.dap]
path = "../dap"

[dependencies.dap_adapters]
path = "../dap_adapters"
optional = true

[dependencies.db]
path = "../db"

[dependencies.debugger_tools]
path = "../debugger_tools"

[dependencies.editor]
path = "../editor"

[dependencies.feature_flags]
path = "../feature_flags"

[dependencies.file_icons]
path = "../file_icons"

[dependencies.futures]
version = "0.3.34"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.hex]
version = "0.4.3"

[dependencies.indoc]
version = "2"

[dependencies.itertools]
version = "0.14.0"

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.menu]
path = "../menu"

[dependencies.notifications]
path = "../notifications"

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.parse_int]
version = "0.9"

[dependencies.paths]
path = "../paths"

[dependencies.picker]
path = "../picker"

[dependencies.project]
path = "../project"

[dependencies.rpc]
path = "../rpc"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.search]
path = "../search"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.serde_json_lenient]
version = "0.2"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.sysinfo]
version = "0.39"
default-features = false
features = ["system"]

[dependencies.task]
path = "../task"

[dependencies.tasks_ui]
path = "../tasks_ui"

[dependencies.terminal]
path = "../terminal"

[dependencies.terminal_view]
path = "../terminal_view"

[dependencies.text]
path = "../text"

[dependencies.theme]
path = "../theme"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.ui]
path = "../ui"

[dependencies.ui_input]
path = "../ui_input"

[dependencies.unindent]
version = "0.2.0"
optional = true

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"

[dev-dependencies.command_palette_hooks]
path = "../command_palette_hooks"

[dev-dependencies.dap]
path = "../dap"
features = ["test-support"]

[dev-dependencies.dap_adapters]
path = "../dap_adapters"
features = ["test-support"]

[dev-dependencies.debugger_tools]
path = "../debugger_tools"
features = ["test-support"]

[dev-dependencies.editor]
path = "../editor"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.tree-sitter-go]
git = "https://github.com/zed-industries/tree-sitter-go"
rev = "6862a49e3c5a7567a6c576420e9a8f944e198a85"

[dev-dependencies.unindent]
version = "0.2.0"

[dev-dependencies.util]
path = "../util"
features = ["test-support"]

[dev-dependencies.workspace]
path = "../workspace"
features = ["test-support"]

[dev-dependencies.zlog]
path = "../zlog"
