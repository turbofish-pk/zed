[package]
name = "snippet_provider"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]


[dependencies.anyhow]
version = "1.0.86"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.extension]
path = "../extension"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.paths]
path = "../paths"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.serde_json_lenient]
version = "0.2"
features = ["preserve_order", "raw_value"]

[dependencies.snippet]
path = "../snippet"

[dependencies.util]
path = "../util"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dev-dependencies.fs]
path = "../fs"


[dev-dependencies.gpui]
path = "../gpui"
default-features = false


[dev-dependencies.indoc]
version = "2"
