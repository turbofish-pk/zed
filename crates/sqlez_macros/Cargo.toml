[package]
name = "sqlez_macros"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/sqlez_macros.rs"
proc-macro = true
doctest = false
test = false

[dependencies.sqlformat]
version = "0.2"

[dependencies.syn]
version = "2.0"
default-features = false
features = ["proc-macro"]

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies.sqlez]
path = "../sqlez"
