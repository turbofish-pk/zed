[package]
name = "hang_telemetry"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/hang_telemetry.rs"
doctest = false

[dependencies.gpui]
path = "../gpui"
default-features = false
features = ["profiler"]

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.telemetry_events]
path = "../telemetry_events"
