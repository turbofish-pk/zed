[package]
name = "syntax_theme"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[features]
default = []
test-support = ["gpui/test-support"]
bundled-themes = ["dep:serde", "dep:serde_json"]

[lib]
path = "src/syntax_theme.rs"
doctest = false

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.serde]
version = "1.0"
features = ["rc"]
optional = true

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]
optional = true

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]
