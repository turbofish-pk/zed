[package]
name = "acp_thread"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/acp_thread.rs"
doctest = false

[features]
test-support = ["gpui/test-support", "project/test-support", "dep:parking_lot"]

[dependencies.action_log]
path = "../action_log"

[dependencies.agent_settings]
path = "../agent_settings"

[dependencies.agent-client-protocol]
version = "=3.5.0"
features = ["schemars", "unstable", "unstable_protocol_v2"]

[dependencies.async-channel]
version = "2.5"
default-features = false

[dependencies.base64]
version = "0.22"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.buffer_diff]
path = "../buffer_diff"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.diffy]
version = "0.4.2"

[dependencies.feature_flags]
path = "../feature_flags"

[dependencies.multi_buffer]
path = "../multi_buffer"

[dependencies.file_icons]
path = "../file_icons"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.http_proxy]
path = "../http_proxy"

[dependencies.itertools]
version = "0.14.0"

[dependencies.language]
path = "../language"

[dependencies.language_model]
path = "../language_model"

[dependencies.libc]
version = "0.2"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.markdown]
path = "../markdown"

[dependencies.mime]
version = "0.3.17"

[dependencies.parking_lot]
version = "0.12.1"
optional = true

[dependencies.image]
version = "0.25.1"
default-features = false
features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"]

[dependencies.project]
path = "../project"

[dependencies.sandbox]
path = "../sandbox"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.task]
path = "../task"

[dependencies.telemetry]
path = "../telemetry"

[dependencies.terminal]
path = "../terminal"

[dependencies.text]
path = "../text"

[dependencies.ui]
path = "../ui"

[dependencies.url]
version = "2.2"

[dependencies.util]
path = "../util"

[dependencies.uuid]
version = "1.1"
features = ["serde"]

[dependencies.watch]
path = "../watch"

[dependencies.urlencoding]
version = "2.1.2"

[dev-dependencies.env_logger]
version = "0.11"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.indoc]
version = "2"

[dev-dependencies.markdown]
path = "../markdown"
features = ["test-support"]

[dev-dependencies.parking_lot]
version = "0.12.1"

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dev-dependencies.tempfile]
version = "3.20.0"

[dev-dependencies.util]
path = "../util"

[dev-dependencies.settings]
path = "../settings"
