[package]
name = "gpui"
version = "0.2.2"
authors = ["Nathan Sobo <nathan@zed.dev>"]
description = "Zed's GPU-accelerated UI framework"
repository = "https://github.com/zed-industries/zed"
publish = true
license = "Apache-2.0"
homepage = "https://gpui.rs"
readme = "README.md"
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]
autobenches = false

[package.edition]
workspace = true

[package.metadata.cargo-shear]
ignored = ["getrandom", "objc2", "objc2-metal"]
ignored-paths = ["src/_ownership_and_data_flow.rs"]

[lints]
workspace = true

[features]
default = ["font-kit", "wayland"]


inspector = ["gpui_macros/inspector"]
leak-detection = []
font-kit = []
wayland = []

profiler = ["dep:hdrhistogram"]
stacker = ["dep:stacksafe"]
hot-reload = ["dep:async-tungstenite", "dep:dioxus-cli-config", "dep:dioxus-devtools-types", "dep:smol", "dep:subsecond"]

[lib]
path = "src/gpui.rs"

[dependencies]
num_cpus = "1.13"
parking = "2.0.0"
ttf-parser = "0.25"
seahash = "4.1"
waker-fn = "1.2.0"
lyon = "1.0"
pin-project = "1.1.10"

[dependencies.accesskit]
version = "0.24.0"
features = ["enumn"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-task]
version = "4.7"

[dependencies.backtrace]
version = "0.3"

[dependencies.bitflags]
version = "2.6.0"

[dependencies.collections]
path = "../collections"
version = "0.1.0"



[dependencies.criterion]
version = "0.8.2"
features = ["html_reports"]
optional = true

[dependencies.ctor]
version = "1.0.12"

[dependencies.derive_more]
version = "2.1"
features = ["deref", "deref_mut", "from_str", "add", "add_assign", "mul", "mul_assign", "not"]

[dependencies.etagere]
version = "0.2"

[dependencies.futures]
version = "0.3.34"

[dependencies.futures-concurrency]
version = "7.7.1"
optional = true

[dependencies.gpui_macros]
path = "../gpui_macros"

[dependencies.gpui_shared_string]
path = "../gpui_shared_string"

[dependencies.http_client]
path = "../http_client"

[dependencies.image]
version = "0.25.1"
default-features = false
features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"]

[dependencies.inventory]
version = "0.3.19"

[dependencies.itertools]
version = "0.14.0"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.postage]
version = "0.5"
default-features = false
features = ["blocking"]
optional = true

[dependencies.proptest]
version = "1.12.0"
features = ["attr-macro"]
optional = true

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde", "clock"]

[dependencies.profiling]
version = "1"

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng", "small_rng", "thread_rng"]

[dependencies.raw-window-handle]
version = "0.6"

[dependencies.regex]
version = "1.5"
default-features = false
features = ["std", "perf"]

[dependencies.refineable]
path = "../refineable"

[dependencies.scheduler]
path = "../scheduler"

[dependencies.resvg]
version = "0.46.0"
default-features = false
features = ["text", "system-fonts", "memmap-fonts", "raster-images"]

[dependencies.usvg]
version = "0.46.0"
default-features = false

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2", "derive"]

[dependencies.serde]
version = "1.0"
features = ["rc", "derive"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.slotmap]
version = "1.0.6"

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.stacksafe]
version = "1.0"
optional = true

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.sum_tree]
path = "../sum_tree"

[dependencies.taffy]
version = "=0.15.0"
default-features = false
features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "float_layout", "content_size"]

[dependencies.thiserror]
version = "2.0.12"

[dependencies.gpui_util]
path = "../gpui_util"

[dependencies.hdrhistogram]
version = "7"
default-features = false
optional = true

[dependencies.spin]
version = "0.10"
default-features = false
features = ["mutex", "spin_mutex", "lock_api"]

[dependencies.url]
version = "2.2"

[dependencies.uuid]
version = "1.1"
features = ["serde", "v4"]

[dependencies.web-time]
version = "1.1.0"
optional = true

[dependencies.heapless]
version = "0.9.2"


[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies.async-channel]
version = "2.5"
default-features = false
features = ["std"]

[target.'cfg(not(target_family = "wasm"))'.dependencies.pollster]
version = "0.4.0"



[dependencies.async-tungstenite]
version = "0.33"
optional = true

[target.'cfg(any(target_os = "linux"))'.dependencies.dioxus-cli-config]
version = "=0.7.10"
optional = true

[target.'cfg(any(target_os = "linux"))'.dependencies.dioxus-devtools-types]
version = "=0.7.10"
optional = true

[target.'cfg(any(target_os = "linux"))'.dependencies.smol]
version = "2.0"
optional = true

[target.'cfg(any(target_os = "linux"))'.dependencies.subsecond]
version = "=0.7.10"
optional = true

[target.'cfg(target_family = "wasm")'.dependencies.uuid]
version = "1.1"
features = ["serde", "js"]


[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies.libc]
version = "0.2"

