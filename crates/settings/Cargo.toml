[package]
name = "settings"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/settings.rs"
doctest = false

[features]
test-support = ["gpui/test-support", "fs/test-support"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.ec4rs]
version = "1.2"
features = ["allow-empty-values"]

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.inventory]
version = "0.3.19"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std", "kv_unstable_std"]

[dependencies.migrator]
path = "../migrator"

[dependencies.paths]
path = "../paths"

[dependencies.release_channel]
path = "../release_channel"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.serde_json_lenient]
version = "0.2"
features = ["preserve_order", "raw_value"]

[dependencies.settings_content]
path = "../settings_content"

[dependencies.settings_json]
path = "../settings_json"
default-features = false
features = ["editing"]

[dependencies.settings_macros]
path = "../settings_macros"

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.util]
path = "../util"

[dev-dependencies.fs]
path = "../fs"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.zlog]
path = "../zlog"

[dev-dependencies.indoc]
version = "2"

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.unindent]
version = "0.2.0"
