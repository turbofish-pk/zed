[package]
name = "deepseek"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/deepseek.rs"
test = false
doctest = false

[features]
default = []
schemars = ["dep:schemars"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.futures]
version = "0.3.34"

[dependencies.http_client]
path = "../http_client"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2", "derive"]
optional = true

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]
