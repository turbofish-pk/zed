[package]
name = "title_bar"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/title_bar.rs"
doctest = false

[features]
default = []


[dependencies]
arrayvec = "0.7.6"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.fs]
path = "../fs"

[dependencies.platform_title_bar]
path = "../platform_title_bar"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.client]
path = "../client"

[dependencies.db]
path = "../db"

[dependencies.git_ui_core]
path = "../git_ui_core"

[dependencies.gpui]
path = "../gpui"
default-features = false
features = []

[dependencies.icons]
path = "../icons"

[dependencies.path]
path = "../path"

[dependencies.project]
path = "../project"

[dependencies.recent_projects]
path = "../recent_projects"

[dependencies.rpc]
path = "../rpc"

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.settings]
path = "../settings"

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.theme]
path = "../theme"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"


[dev-dependencies.client]
path = "../client"


[dev-dependencies.gpui]
path = "../gpui"
default-features = false

[dev-dependencies.project]
path = "../project"


[dev-dependencies.recent_projects]
path = "../recent_projects"

[dev-dependencies.rpc]
path = "../rpc"

[dev-dependencies.semver]
version = "1.0"
features = ["serde"]

[dev-dependencies.settings]
path = "../settings"


[dev-dependencies.theme_settings]
path = "../theme_settings"

[dev-dependencies.util]
path = "../util"


[dev-dependencies.workspace]
path = "../workspace"
