[package]
name = "title_bar"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/title_bar.rs"
doctest = false

[features]
default = []
test-support = ["call/test-support", "client/test-support", "gpui/test-support", "project/test-support", "remote/test-support", "util/test-support", "workspace/test-support", "recent_projects/test-support"]

[dependencies]
arrayvec = "0.7.6"

[dependencies.agent_settings]
path = "../agent_settings"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.auto_update]
path = "../auto_update"

[dependencies.fs]
path = "../fs"

[dependencies.platform_title_bar]
path = "../platform_title_bar"

[dependencies.call]
path = "../call"

[dependencies.channel]
path = "../channel"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.client]
path = "../client"

[dependencies.cloud_api_types]
path = "../cloud_api_types"

[dependencies.command_palette_hooks]
path = "../command_palette_hooks"

[dependencies.db]
path = "../db"

[dependencies.git_ui_core]
path = "../git_ui_core"

[dependencies.gpui]
path = "../gpui"
default-features = false
features = ["screen-capture"]

[dependencies.icons]
path = "../icons"

[dependencies.livekit_client]
path = "../livekit_client"

[dependencies.path]
path = "../path"

[dependencies.project]
path = "../project"

[dependencies.recent_projects]
path = "../recent_projects"

[dependencies.remote]
path = "../remote"

[dependencies.remote_connection]
path = "../remote_connection"

[dependencies.rpc]
path = "../rpc"

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.settings]
path = "../settings"

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.telemetry]
path = "../telemetry"

[dependencies.theme]
path = "../theme"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"

[dev-dependencies.call]
path = "../call"
features = ["test-support"]

[dev-dependencies.client]
path = "../client"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.recent_projects]
path = "../recent_projects"
features = ["test-support"]

[dev-dependencies.remote]
path = "../remote"
features = ["test-support"]

[dev-dependencies.rpc]
path = "../rpc"
features = ["test-support"]

[dev-dependencies.semver]
version = "1.0"
features = ["serde"]

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]

[dev-dependencies.theme_settings]
path = "../theme_settings"

[dev-dependencies.util]
path = "../util"
features = ["test-support"]

[dev-dependencies.workspace]
path = "../workspace"
features = ["test-support"]
