[package]
name = "theme_settings"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[features]
default = []
test-support = ["gpui/test-support", "settings/test-support", "theme/test-support"]

[lib]
path = "src/theme_settings.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.gpui_util]
path = "../gpui_util"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.palette]
version = "0.7.5"
default-features = false
features = ["std"]

[dependencies.refineable]
path = "../refineable"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.serde_json_lenient]
version = "0.2"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.theme]
path = "../theme"

[dependencies.uuid]
version = "1.1"
features = ["serde"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]
