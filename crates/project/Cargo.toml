[package]
name = "project"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["tracing"]

[lints]
workspace = true

[lib]
path = "src/project.rs"
doctest = false

[features]

[dependencies.aho-corasick]
version = "1.1"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.askpass]
path = "../askpass"

[dependencies.async-channel]
version = "2.5"
default-features = false

[dependencies.async-lock]
version = "3.4"
default-features = false

[dependencies.async-trait]
version = "0.1"

[dependencies.base64]
version = "0.22"

[dependencies.buffer_diff]
path = "../buffer_diff"

[dependencies.client]
path = "../client"

[dependencies.clock]
path = "../clock"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.context_server]
path = "../context_server"

[dependencies.credentials_provider]
path = "../credentials_provider"

[dependencies.dap]
path = "../dap"

[dependencies.encoding_rs]
version = "0.8"

[dependencies.extension]
path = "../extension"

[dependencies.fancy-regex]
version = "0.19"

[dependencies.file_content]
path = "../file_content"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.fuzzy_nucleo]
path = "../fuzzy_nucleo"

[dependencies.git]
path = "../git"

[dependencies.git_hosting_providers]
path = "../git_hosting_providers"

[dependencies.globset]
version = "0.4"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.http_client]
path = "../http_client"
features = ["github-download"]

[dependencies.image]
version = "0.25.1"
default-features = false
features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"]

[dependencies.indexmap]
version = "2.7.0"
features = ["serde"]

[dependencies.itertools]
version = "0.14.0"

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.lsp]
path = "../lsp"

[dependencies.markdown]
path = "../markdown"

[dependencies.node_runtime]
path = "../node_runtime"

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.path]
path = "../path"

[dependencies.paths]
path = "../paths"

[dependencies.percent-encoding]
version = "2.3.2"

[dependencies.postage]
version = "0.5"
default-features = false

[dependencies.prettier]
path = "../prettier"

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dependencies.regex]
version = "1.5"
default-features = false
features = ["std", "perf"]

[dependencies.release_channel]
path = "../release_channel"



[dependencies.rpc]
path = "../rpc"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.sha2]
version = "0.10"

[dependencies.shellexpand]
version = "3.1"

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.smol]
version = "2.0"

[dependencies.snippet]
path = "../snippet"

[dependencies.snippet_provider]
path = "../snippet_provider"

[dependencies.sum_tree]
path = "../sum_tree"

[dependencies.task]
path = "../task"

[dependencies.tempfile]
version = "3.20.0"

[dependencies.terminal]
path = "../terminal"

[dependencies.text]
path = "../text"

[dependencies.toml]
version = "0.9"
default-features = false
features = ["std", "serde", "parse"]

[dependencies.tracing]
version = "0.1.40"

[dependencies.url]
version = "2.2"

[dependencies.util]
path = "../util"

[dependencies.watch]
path = "../watch"

[dependencies.wax]
version = "0.7"
default-features = false

[dependencies.which]
version = "8"

[dependencies.worktree]
path = "../worktree"

[dependencies.zed_credentials_provider]
path = "../zed_credentials_provider"

[dependencies.zeroize]
version = "1.8"

[dependencies.zlog]
path = "../zlog"

[dependencies.ztracing]
path = "../ztracing"
