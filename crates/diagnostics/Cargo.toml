[package]
name = "diagnostics"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/diagnostics.rs"
doctest = false

[dependencies.agent_settings]
path = "../agent_settings"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.ctor]
version = "1.0.12"

[dependencies.editor]
path = "../editor"

[dependencies.futures-lite]
version = "2"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.indoc]
version = "2"

[dependencies.itertools]
version = "0.14.0"

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.lsp]
path = "../lsp"

[dependencies.markdown]
path = "../markdown"

[dependencies.project]
path = "../project"

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.text]
path = "../text"

[dependencies.theme]
path = "../theme"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"

[dev-dependencies.editor]
path = "../editor"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.lsp]
path = "../lsp"
features = ["test-support"]

[dev-dependencies.markdown]
path = "../markdown"
features = ["test-support"]

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.theme]
path = "../theme"
features = ["test-support"]

[dev-dependencies.unindent]
version = "0.2.0"

[dev-dependencies.workspace]
path = "../workspace"
features = ["test-support"]

[dev-dependencies.zlog]
path = "../zlog"
