[package]
name = "edit_prediction_metrics"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.publish]
workspace = true

[package.edition]
workspace = true

[lints]
workspace = true

[lib]
path = "src/edit_prediction_metrics.rs"
doctest = false

[features]
tree-sitter = ["dep:tree-sitter"]

[dependencies]
serde_json = "1.0"

[dependencies.imara-diff]
version = "0.2"
default-features = false

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.similar]
version = "2.7"

[dependencies.tree-sitter]
git = "https://github.com/tree-sitter/tree-sitter"
rev = "803c6ebaac27d69e1808b45058482e868d073ceb"
optional = true

[dependencies.zeta_prompt]
path = "../zeta_prompt"

[dev-dependencies.indoc]
version = "2"
