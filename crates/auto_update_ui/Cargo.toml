[package]
name = "auto_update_ui"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/auto_update_ui.rs"
test = false
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.auto_update]
path = "../auto_update"

[dependencies.client]
path = "../client"

[dependencies.db]
path = "../db"

[dependencies.editor]
path = "../editor"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.markdown_preview]
path = "../markdown_preview"

[dependencies.project]
path = "../project"

[dependencies.release_channel]
path = "../release_channel"

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.smol]
version = "2.0"

[dependencies.telemetry]
path = "../telemetry"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"
