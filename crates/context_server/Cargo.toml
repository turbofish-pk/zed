[package]
name = "context_server"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/context_server.rs"
doctest = false

[features]
test-support = ["gpui/test-support"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-channel]
version = "2.5"
default-features = false

[dependencies.async-trait]
version = "0.1"

[dependencies.base64]
version = "0.22"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.futures]
version = "0.3.34"

[dependencies.futures-lite]
version = "2"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.http_client]
path = "../http_client"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.net]
path = "../net"

[dependencies.oauth_callback_server]
path = "../oauth_callback_server"

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dependencies.postage]
version = "0.5"
default-features = false

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.settings]
path = "../settings"

[dependencies.sha2]
version = "0.10"

[dependencies.slotmap]
version = "1.0.6"

[dependencies.tempfile]
version = "3.20.0"

[dependencies.url]
version = "2.2"
features = ["serde"]

[dependencies.util]
path = "../util"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.http_client]
path = "../http_client"
features = ["test-support"]
