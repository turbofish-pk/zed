[package]
name = "zlog"
version = "0.1.0"
license = "Apache-2.0"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/zlog.rs"
doctest = false

[features]
default = []

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.log]
version = "0.4"
default-features = false
features = ["std", "kv_unstable_std"]

[dependencies.anyhow]
version = "1.0.86"

[dev-dependencies.tempfile]
version = "3.20.0"
