[package]
name = "cloud_api_types"
version = "0.1.0"
license = "Apache-2.0"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/cloud_api_types.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.ciborium]
version = "0.2"

[dependencies.cloud_llm_client]
path = "../cloud_llm_client"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.zeta_prompt]
path = "../zeta_prompt"

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]
