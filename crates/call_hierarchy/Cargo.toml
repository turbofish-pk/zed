[package]
name = "call_hierarchy"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/call_hierarchy.rs"
doctest = false

[dependencies.editor]
path = "../editor"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.menu]
path = "../menu"

[dependencies.picker]
path = "../picker"

[dependencies.project]
path = "../project"

[dependencies.proto]
path = "../proto"

[dependencies.settings]
path = "../settings"

[dependencies.theme]
path = "../theme"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"

[dev-dependencies.futures]
version = "0.3.34"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.lsp]
path = "../lsp"
features = ["test-support"]

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.workspace]
path = "../workspace"
features = ["test-support"]

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.theme]
path = "../theme"
features = ["test-support"]

[dev-dependencies.tree-sitter-rust]
version = "0.24.2"
