[package]
name = "lsp_command_selector"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/lsp_command_selector.rs"
doctest = false

[dependencies.editor]
path = "../editor"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.lsp]
path = "../lsp"

[dependencies.picker]
path = "../picker"

[dependencies.project]
path = "../project"

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.ui]
path = "../ui"

[dependencies.workspace]
path = "../workspace"
