[package]
name = "language_tools"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/language_tools.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.client]
path = "../client"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.command_palette_hooks]
path = "../command_palette_hooks"

[dependencies.editor]
path = "../editor"

[dependencies.edit_prediction]
path = "../edit_prediction"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.itertools]
version = "0.14.0"

[dependencies.language]
path = "../language"

[dependencies.lsp]
path = "../lsp"

[dependencies.menu]
path = "../menu"

[dependencies.path]
path = "../path"

[dependencies.project]
path = "../project"

[dependencies.proto]
path = "../proto"

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.telemetry]
path = "../telemetry"

[dependencies.theme]
path = "../theme"

[dependencies.tree-sitter]
git = "https://github.com/tree-sitter/tree-sitter"
rev = "803c6ebaac27d69e1808b45058482e868d073ceb"
features = ["wasm"]

[dependencies.sysinfo]
version = "0.39"
default-features = false
features = ["system"]

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"

[dev-dependencies.editor]
path = "../editor"
features = ["test-support"]

[dev-dependencies.release_channel]
path = "../release_channel"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.semver]
version = "1.0"
features = ["serde"]

[dev-dependencies.util]
path = "../util"
features = ["test-support"]

[dev-dependencies.zlog]
path = "../zlog"

[dev-dependencies.theme_settings]
path = "../theme_settings"
