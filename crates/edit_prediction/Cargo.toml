[package]
name = "edit_prediction"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/edit_prediction.rs"
doctest = false

[features]
cli-support = []

[dependencies.ai_onboarding]
path = "../ai_onboarding"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.heapless]
version = "0.9.2"

[dependencies.buffer_diff]
path = "../buffer_diff"

[dependencies.client]
path = "../client"

[dependencies.clock]
path = "../clock"

[dependencies.cloud_api_client]
path = "../cloud_api_client"

[dependencies.cloud_api_types]
path = "../cloud_api_types"

[dependencies.cloud_llm_client]
path = "../cloud_llm_client"
features = ["predict-edits"]

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.copilot]
path = "../copilot"

[dependencies.copilot_ui]
path = "../copilot_ui"

[dependencies.credentials_provider]
path = "../credentials_provider"

[dependencies.db]
path = "../db"

[dependencies.edit_prediction_types]
path = "../edit_prediction_types"

[dependencies.edit_prediction_context]
path = "../edit_prediction_context"

[dependencies.edit_prediction_metrics]
path = "../edit_prediction_metrics"
features = ["tree-sitter"]

[dependencies.feature_flags]
path = "../feature_flags"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.git]
path = "../git"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.indoc]
version = "2"

[dependencies.itertools]
version = "0.14.0"

[dependencies.language]
path = "../language"

[dependencies.language_model]
path = "../language_model"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.lsp]
path = "../lsp"

[dependencies.menu]
path = "../menu"

[dependencies.ollama]
path = "../ollama"

[dependencies.open_ai]
path = "../open_ai"

[dependencies.postage]
version = "0.5"
default-features = false

[dependencies.project]
path = "../project"

[dependencies.pulldown-cmark]
version = "0.13.0"
default-features = false

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dependencies.regex]
version = "1.5"
default-features = false
features = ["std", "perf"]

[dependencies.release_channel]
path = "../release_channel"

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.telemetry]
path = "../telemetry"

[dependencies.telemetry_events]
path = "../telemetry_events"

[dependencies.text]
path = "../text"

[dependencies.thiserror]
version = "2.0.12"

[dependencies.toml]
version = "0.9"
default-features = false
features = ["std", "serde", "parse", "display"]

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.uuid]
version = "1.1"
features = ["serde"]

[dependencies.workspace]
path = "../workspace"

[dependencies.worktree]
path = "../worktree"

[dependencies.zed_actions]
path = "../zed_actions"

[dependencies.zed_credentials_provider]
path = "../zed_credentials_provider"

[dependencies.zeta_prompt]
path = "../zeta_prompt"

[dependencies.zstd]
version = "0.13"
default-features = false
features = ["legacy", "arrays"]

[dev-dependencies.criterion]
version = "0.8.2"
features = ["html_reports"]

[dev-dependencies.fs]
path = "../fs"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.languages]
path = "../languages"
features = ["load-grammars"]

[dev-dependencies.node_runtime]
path = "../node_runtime"

[dev-dependencies.clock]
path = "../clock"
features = ["test-support"]

[dev-dependencies.cloud_llm_client]
path = "../cloud_llm_client"
features = ["test-support"]

[dev-dependencies.ctor]
version = "1.0.12"

[dev-dependencies.indoc]
version = "2"

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.language_model]
path = "../language_model"
features = ["test-support"]

[dev-dependencies.lsp]
path = "../lsp"

[dev-dependencies.parking_lot]
version = "0.12.1"

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]

[dev-dependencies.workspace]
path = "../workspace"
features = ["test-support"]

[dev-dependencies.zlog]
path = "../zlog"

[[bench]]
name = "kept_rate"
harness = false

[[bench]]
name = "ts_error_count"
harness = false
