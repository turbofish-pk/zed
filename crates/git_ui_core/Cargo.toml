[package]
name = "git_ui_core"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
name = "git_ui_core"
path = "src/git_ui_core.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.askpass]
path = "../askpass"

[dependencies.buffer_diff]
path = "../buffer_diff"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.db]
path = "../db"

[dependencies.editor]
path = "../editor"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.git]
path = "../git"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.menu]
path = "../menu"

[dependencies.notifications]
path = "../notifications"

[dependencies.picker]
path = "../picker"

[dependencies.project]
path = "../project"

[dependencies.proto]
path = "../proto"

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.terminal]
path = "../terminal"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.watch]
path = "../watch"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"

[dependencies.zeroize]
version = "1.8"

[dependencies.ztracing]
path = "../ztracing"
