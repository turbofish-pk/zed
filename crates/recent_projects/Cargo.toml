[package]
name = "recent_projects"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/recent_projects.rs"
doctest = false

[features]
default = []
test-support = ["remote/test-support", "remote_connection/test-support", "project/test-support", "workspace/test-support"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.askpass]
path = "../askpass"

[dependencies.db]
path = "../db"

[dependencies.dev_container]
path = "../dev_container"

[dependencies.editor]
path = "../editor"

[dependencies.extension_host]
path = "../extension_host"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.fuzzy_nucleo]
path = "../fuzzy_nucleo"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.menu]
path = "../menu"

[dependencies.node_runtime]
path = "../node_runtime"

[dependencies.open_path_prompt]
path = "../open_path_prompt"

[dependencies.ordered-float]
version = "5"

[dependencies.paths]
path = "../paths"

[dependencies.picker]
path = "../picker"

[dependencies.project]
path = "../project"

[dependencies.release_channel]
path = "../release_channel"

[dependencies.remote]
path = "../remote"

[dependencies.remote_connection]
path = "../remote_connection"

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.telemetry]
path = "../telemetry"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dependencies.worktree]
path = "../worktree"

[dependencies.zed_actions]
path = "../zed_actions"

[dependencies.indoc]
version = "2"

[target.'cfg(target_os = "windows")'.dependencies.windows-registry]
version = "0.6.0"

[dev-dependencies.editor]
path = "../editor"
features = ["test-support"]

[dev-dependencies.extension]
path = "../extension"

[dev-dependencies.fs]
path = "../fs"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.http_client]
path = "../http_client"

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.picker]
path = "../picker"
features = ["test-support"]

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.release_channel]
path = "../release_channel"

[dev-dependencies.remote]
path = "../remote"
features = ["test-support"]

[dev-dependencies.remote_connection]
path = "../remote_connection"
features = ["test-support"]

[dev-dependencies.remote_server]
path = "../remote_server"

[dev-dependencies.rpc]
path = "../rpc"

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]

[dev-dependencies.workspace]
path = "../workspace"
features = ["test-support"]
