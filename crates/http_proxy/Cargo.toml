[package]
name = "http_proxy"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/http_proxy.rs"
doctest = false

[features]
nixos-integration-tests = []

[dependencies.anyhow]
version = "1.0.86"

[dependencies.base64]
version = "0.22"

[dependencies.futures]
version = "0.3.34"

[dependencies.httparse]
version = "1.10"

[dependencies.idna]
version = "1.0"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.percent-encoding]
version = "2.3.2"

[dependencies.proxyvars]
version = "0.2"

[dependencies.thiserror]
version = "2.0.12"

[dependencies.url]
version = "2.2"
