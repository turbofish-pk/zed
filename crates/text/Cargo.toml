[package]
name = "text"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/text.rs"
doctest = false

[features]
test-support = ["rand", "dep:util", "util/test-support"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.clock]
path = "../clock"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.gpui_util]
path = "../gpui_util"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.postage]
version = "0.5"
default-features = false

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]
optional = true

[dependencies.regex]
version = "1.5"
default-features = false
features = ["std", "perf"]

[dependencies.rope]
path = "../rope"

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.sum_tree]
path = "../sum_tree"

[dependencies.util]
path = "../util"
optional = true

[dev-dependencies.collections]
path = "../collections"
version = "0.1.0"
features = ["test-support"]

[dev-dependencies.ctor]
version = "1.0.12"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dev-dependencies.util]
path = "../util"
features = ["test-support"]

[dev-dependencies.zlog]
path = "../zlog"
