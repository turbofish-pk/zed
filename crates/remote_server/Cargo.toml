[package]
name = "remote_server"
description = "Daemon used for remote editing"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["rust-embed"]

[lints]
workspace = true

[lib]
path = "src/server.rs"
doctest = false

[[bin]]
name = "remote_server"

[features]
default = []
debug-embed = ["dep:rust-embed", "util/debug-embed"]
test-support = ["fs/test-support"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-channel]
version = "2.5"
default-features = false

[dependencies.askpass]
path = "../askpass"

[dependencies.clap]
version = "4.4"
features = ["derive", "wrap_help"]

[dependencies.client]
path = "../client"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.crashes]
path = "../crashes"

[dependencies.dap_adapters]
path = "../dap_adapters"

[dependencies.debug_adapter_extension]
path = "../debug_adapter_extension"

[dependencies.env_logger]
version = "0.11"

[dependencies.extension]
path = "../extension"

[dependencies.extension_host]
path = "../extension_host"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.git]
path = "../git"

[dependencies.git_hosting_providers]
path = "../git_hosting_providers"

[dependencies.gpui]
path = "../gpui"
default-features = false
features = ["profiler"]

[dependencies.gpui_platform]
path = "../gpui_platform"
default-features = false

[dependencies.gpui_tokio]
path = "../gpui_tokio"

[dependencies.http_client]
path = "../http_client"

[dependencies.image]
version = "0.25.1"
default-features = false
features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"]

[dependencies.json_schema_store]
path = "../json_schema_store"

[dependencies.language]
path = "../language"

[dependencies.language_extension]
path = "../language_extension"

[dependencies.languages]
path = "../languages"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.lsp]
path = "../lsp"

[dependencies.net]
path = "../net"

[dependencies.node_runtime]
path = "../node_runtime"

[dependencies.paths]
path = "../paths"

[dependencies.project]
path = "../project"

[dependencies.proto]
path = "../proto"

[dependencies.release_channel]
path = "../release_channel"

[dependencies.remote]
path = "../remote"

[dependencies.reqwest_client]
path = "../reqwest_client"

[dependencies.rpc]
path = "../rpc"

[dependencies.rust-embed]
version = "8.11"
features = ["include-exclude", "compression", "debug-embed"]
optional = true

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.shellexpand]
version = "3.1"

[dependencies.smol]
version = "2.0"

[dependencies.sysinfo]
version = "0.39"
default-features = false
features = ["system"]

[dependencies.task]
path = "../task"

[dependencies.telemetry]
path = "../telemetry"

[dependencies.terminal]
path = "../terminal"

[dependencies.util]
path = "../util"

[dependencies.watch]
path = "../watch"

[dependencies.worktree]
path = "../worktree"

[dependencies.thiserror]
version = "2.0.12"

[dependencies.rayon]
version = "1.8"

[dependencies.uuid]
version = "1.1"
features = ["serde", "v4"]

[target."cfg(unix)".dependencies.libc]
version = "0.2"

[target."cfg(windows)".dependencies.gpui]
path = "../gpui"
default-features = false
features = ["windows-manifest"]

[dev-dependencies.acp_thread]
path = "../acp_thread"

[dev-dependencies.action_log]
path = "../action_log"

[dev-dependencies.agent]
path = "../agent"
features = ["test-support"]

[dev-dependencies.agent-client-protocol]
version = "=3.5.0"
features = ["schemars", "unstable", "unstable_protocol_v2"]

[dev-dependencies.agent_servers]
path = "../agent_servers"

[dev-dependencies.client]
path = "../client"
features = ["test-support"]

[dev-dependencies.clock]
path = "../clock"
features = ["test-support"]

[dev-dependencies.editor]
path = "../editor"
features = ["test-support"]

[dev-dependencies.fs]
path = "../fs"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.http_client]
path = "../http_client"
features = ["test-support"]

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.language_model]
path = "../language_model"
features = ["test-support"]

[dev-dependencies.lsp]
path = "../lsp"
features = ["test-support"]

[dev-dependencies.node_runtime]
path = "../node_runtime"
features = ["test-support"]

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.remote]
path = "../remote"
features = ["test-support"]

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.tempfile]
version = "3.20.0"

[dev-dependencies.theme]
path = "../theme"
features = ["test-support"]

[dev-dependencies.theme_settings]
path = "../theme_settings"

[dev-dependencies.unindent]
version = "0.2.0"

[dev-dependencies.workspace]
path = "../workspace"
features = ["test-support"]

[dev-dependencies.zlog]
path = "../zlog"

[build-dependencies.toml_edit]
version = "0.22"
default-features = false
features = ["parse"]
