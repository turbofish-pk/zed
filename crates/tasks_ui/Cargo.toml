[package]
name = "tasks_ui"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/tasks_ui.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.editor]
path = "../editor"

[dependencies.file_icons]
path = "../file_icons"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.itertools]
version = "0.14.0"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.menu]
path = "../menu"

[dependencies.picker]
path = "../picker"

[dependencies.project]
path = "../project"

[dependencies.task]
path = "../task"

[dependencies.tree-sitter]
git = "https://github.com/tree-sitter/tree-sitter"
rev = "803c6ebaac27d69e1808b45058482e868d073ceb"

[dependencies.tree-sitter-json]
version = "0.24"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dependencies.language]
path = "../language"

[dependencies.zed_actions]
path = "../zed_actions"

[dev-dependencies.editor]
path = "../editor"


[dev-dependencies.gpui]
path = "../gpui"
default-features = false


[dev-dependencies.language]
path = "../language"


[dev-dependencies.project]
path = "../project"


[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.tree-sitter-rust]
version = "0.24.2"

[dev-dependencies.tree-sitter-typescript]
git = "https://github.com/zed-industries/tree-sitter-typescript"
rev = "e2c53597d6a5d9cf7bbe8dccde576fe1e46c5899"

[dev-dependencies.workspace]
path = "../workspace"
