[package]
name = "collab_ui"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/collab_ui.rs"
doctest = false

[features]
default = []
test-support = ["call/test-support", "client/test-support", "collections/test-support", "editor/test-support", "gpui/test-support", "project/test-support", "settings/test-support", "util/test-support", "workspace/test-support", "title_bar/test-support"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.call]
path = "../call"

[dependencies.channel]
path = "../channel"

[dependencies.client]
path = "../client"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.db]
path = "../db"

[dependencies.editor]
path = "../editor"

[dependencies.futures]
version = "0.3.34"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.livekit_client]
path = "../livekit_client"

[dependencies.menu]
path = "../menu"

[dependencies.notifications]
path = "../notifications"

[dependencies.picker]
path = "../picker"

[dependencies.project]
path = "../project"

[dependencies.release_channel]
path = "../release_channel"

[dependencies.rpc]
path = "../rpc"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.smol]
version = "2.0"

[dependencies.telemetry]
path = "../telemetry"

[dependencies.theme]
path = "../theme"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.title_bar]
path = "../title_bar"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"
