[package]
name = "migrator"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/migrator.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.convert_case]
version = "0.11.0"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.streaming-iterator]
version = "0.1"

[dependencies.tree-sitter-json]
version = "0.24"

[dependencies.tree-sitter]
git = "https://github.com/tree-sitter/tree-sitter"
rev = "803c6ebaac27d69e1808b45058482e868d073ceb"

[dependencies.serde_json_lenient]
version = "0.2"
features = ["preserve_order", "raw_value"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings_json]
path = "../settings_json"
default-features = false
features = ["editing"]

# After any possible rebase, I will do this
# rg 'settings_overrides!' -A4 crates/settings_content/src
# in order to update OVERRIDE_KEYS with whatever slop is added by Zed