[package]
name = "acp_tools"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/acp_tools.rs"
doctest = false
test = false

[features]
test-support = ["workspace/test-support"]

[dependencies.acp_thread]
path = "../acp_thread"

[dependencies.agent-client-protocol]
version = "=3.5.0"
features = ["schemars", "unstable", "unstable_protocol_v2"]

[dependencies.agent_servers]
path = "../agent_servers"

[dependencies.agent_ui]
path = "../agent_ui"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language]
path = "../language"

[dependencies.markdown]
path = "../markdown"

[dependencies.project]
path = "../project"

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"
