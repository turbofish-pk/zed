[package]
name = "dev_container"
version = "0.1.0"

[package.publish]
workspace = true

[package.edition]
workspace = true

[lib]
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-tar]
git = "https://github.com/zed-industries/async-tar"
rev = "bd3ad6f89df9a9da7a8535958756d6bf465936a0"

[dependencies.async-trait]
version = "0.1"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.serde_json_lenient]
version = "0.2"
features = ["preserve_order", "raw_value"]

[dependencies.serde_yaml]
package = "serde_yaml_ng"
version = "0.10"

[dependencies.yaml-rust2]
version = "0.8"
default-features = false

[dependencies.shlex]
version = "2.0"

[dependencies.http_client]
path = "../http_client"

[dependencies.http]
version = "1.1"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.menu]
path = "../menu"

[dependencies.regex]
version = "1.5"
default-features = false
features = ["std", "perf"]

[dependencies.picker]
path = "../picker"

[dependencies.project]
path = "../project"

[dependencies.settings]
path = "../settings"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.walkdir]
version = "2.5"

[dependencies.worktree]
path = "../worktree"

[dependencies.workspace]
path = "../workspace"

[dev-dependencies.fs]
path = "../fs"
features = ["test-support"]

[dev-dependencies.indoc]
version = "2"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]

[dev-dependencies.workspace]
path = "../workspace"
features = ["test-support"]

[dev-dependencies.worktree]
path = "../worktree"
features = ["test-support"]

[dev-dependencies.util]
path = "../util"
features = ["test-support"]

[dev-dependencies.env_logger]
version = "0.11"

[lints]
workspace = true
