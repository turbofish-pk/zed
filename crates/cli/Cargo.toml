[package]
name = "cli"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/cli.rs"
doctest = false

[[bin]]
name = "cli"
path = "src/main.rs"
required-features = ["cli"]

[features]
no-bundled-uninstall = ["cli"]
default = ["cli"]
cli = ["dep:askpass", "dep:clap", "dep:clap_complete", "dep:clap_complete_nushell", "dep:console", "dep:core-foundation", "dep:core-services", "dep:dialoguer", "dep:exec", "dep:fork", "dep:parking_lot", "dep:paths", "dep:plist", "dep:rayon", "dep:release_channel", "dep:tempfile", "dep:util", "dep:walkdir", "dep:windows", "dep:windows_resources"]

[dependencies]
ipc-channel = "0.19"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.askpass]
path = "../askpass"
optional = true

[dependencies.clap]
version = "4.4"
features = ["derive", "wrap_help"]
optional = true

[dependencies.clap_complete]
version = "4.4"
optional = true

[dependencies.clap_complete_nushell]
version = "4.4"
optional = true

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.console]
version = "0.16"
optional = true

[dependencies.dialoguer]
version = "0.12"
default-features = false
optional = true

[dependencies.parking_lot]
version = "0.12.1"
optional = true

[dependencies.paths]
path = "../paths"
optional = true

[dependencies.release_channel]
path = "../release_channel"
optional = true

[dependencies.serde]
version = "1.0"
features = ["rc", "derive"]

[dependencies.util]
path = "../util"
optional = true

[dependencies.tempfile]
version = "3.20.0"
optional = true

[dependencies.rayon]
version = "1.8"
optional = true

[dependencies.walkdir]
version = "2.5"
optional = true

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.util]
path = "../util"
features = ["test-support"]

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.exec]
version = "0.3.1"
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.fork]
version = "0.4.0"
optional = true

[target.'cfg(target_os = "macos")'.dependencies.core-foundation]
version = "0.10"
optional = true

[target.'cfg(target_os = "macos")'.dependencies.core-services]
version = "1"
optional = true

[target.'cfg(target_os = "macos")'.dependencies.plist]
version = "1.3"
optional = true

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"]
optional = true

[target.'cfg(target_os = "windows")'.build-dependencies.windows_resources]
path = "../windows_resources"
optional = true
