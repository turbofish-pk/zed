[package]
name = "cli"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/cli.rs"
doctest = false

[[bin]]
name = "cli"
path = "src/main.rs"
required-features = ["cli"]

[features]
no-bundled-uninstall = ["cli"]
default = ["cli"]
cli = ["dep:askpass", "dep:clap", "dep:clap_complete", "dep:console",  "dep:dialoguer", "dep:exec", "dep:fork", "dep:parking_lot", "dep:paths", "dep:rayon", "dep:release_channel", "dep:tempfile", "dep:util", "dep:walkdir"]

[dependencies]
ipc-channel = "0.19"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.askpass]
path = "../askpass"
optional = true

[dependencies.clap]
version = "4.4"
features = ["derive", "wrap_help"]
optional = true

[dependencies.clap_complete]
version = "4.4"
optional = true



[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.console]
version = "0.16"
optional = true

[dependencies.dialoguer]
version = "0.12"
default-features = false
optional = true

[dependencies.parking_lot]
version = "0.12.1"
optional = true

[dependencies.paths]
path = "../paths"
optional = true

[dependencies.release_channel]
path = "../release_channel"
optional = true

[dependencies.serde]
version = "1.0"
features = ["rc", "derive"]

[dependencies.util]
path = "../util"
optional = true

[dependencies.tempfile]
version = "3.20.0"
optional = true

[dependencies.rayon]
version = "1.8"
optional = true

[dependencies.walkdir]
version = "2.5"
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.exec]
version = "0.3.1"
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.fork]
version = "0.4.0"
optional = true
