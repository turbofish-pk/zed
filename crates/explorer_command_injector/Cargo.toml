[package]
name = "explorer_command_injector"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/explorer_command_injector.rs"
doctest = false
test = false

[features]
default = ["nightly"]
stable = []
preview = []
nightly = []

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Globalization", "Win32_System_SystemServices"]

[target.'cfg(target_os = "windows")'.dependencies.windows-core]
version = "0.62"

[target.'cfg(target_os = "windows")'.dependencies.windows-registry]
version = "0.6.0"
