[package]
name = "extensions_ui"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["component"]

[lints]
workspace = true

[lib]
path = "src/extensions_ui.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.command_palette_hooks]
path = "../command_palette_hooks"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.db]
path = "../db"

[dependencies.editor]
path = "../editor"

[dependencies.extension]
path = "../extension"

[dependencies.extension_host]
path = "../extension_host"

[dependencies.extension_suggest]
path = "../extension_suggest"

[dependencies.fs]
path = "../fs"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.git]
path = "../git"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.markdown]
path = "../markdown"

[dependencies.picker]
path = "../picker"

[dependencies.project]
path = "../project"

[dependencies.release_channel]
path = "../release_channel"

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.settings]
path = "../settings"

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.vim_mode_setting]
path = "../vim_mode_setting"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"
