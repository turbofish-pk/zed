[package]
name = "derive_refineable"
version = "0.1.0"
publish = false
license = "Apache-2.0"
description = "A derive macro for creating refinement types in Rust"

[package.edition]
workspace = true

[lints]
workspace = true

[lib]
path = "src/derive_refineable.rs"
proc-macro = true
doctest = false
test = false

[dependencies.proc-macro2]
version = "1.0.93"

[dependencies.quote]
version = "1.0.9"

[dependencies.syn]
version = "2.0"
default-features = false
features = ["proc-macro"]
