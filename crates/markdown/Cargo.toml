[package]
name = "markdown"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/markdown.rs"
doctest = false

[features]
test-support = ["gpui/test-support", "util/test-support"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.base64]
version = "0.22"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.html5ever]
version = "0.39"

[dependencies.language]
path = "../language"

[dependencies.linkify]
version = "0.10.0"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.markup5ever_rcdom]
version = "0.39"

[dependencies.mermaid_render]
path = "../mermaid_render"

[dependencies.pulldown-cmark]
version = "0.13.0"
default-features = false

[dependencies.settings]
path = "../settings"

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.stacksafe]
version = "1.0"

[dependencies.sum_tree]
path = "../sum_tree"

[dependencies.theme]
path = "../theme"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dev-dependencies.assets]
path = "../assets"

[dev-dependencies.env_logger]
version = "0.11"

[dev-dependencies.fs]
path = "../fs"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.gpui_platform]
path = "../gpui_platform"
default-features = false
features = ["wayland", "x11"]

[dev-dependencies.image]
version = "0.25.1"
default-features = false
features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"]

[dev-dependencies.indoc]
version = "2"

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.languages]
path = "../languages"
features = ["load-grammars"]

[dev-dependencies.node_runtime]
path = "../node_runtime"

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]

[dev-dependencies.util]
path = "../util"
features = ["test-support"]
