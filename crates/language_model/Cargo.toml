[package]
name = "language_model"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/language_model.rs"
doctest = false

[features]
test-support = []

[dependencies.anyhow]
version = "1.0.86"

[dependencies.base64]
version = "0.22"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.credentials_provider]
path = "../credentials_provider"

[dependencies.env_var]
path = "../env_var"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.gpui_util]
path = "../gpui_util"

[dependencies.http_client]
path = "../http_client"

[dependencies.icons]
path = "../icons"

[dependencies.image]
version = "0.25.1"
default-features = false
features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"]

[dependencies.language_model_core]
path = "../language_model_core"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.thiserror]
version = "2.0.12"

[dev-dependencies.credentials_provider]
path = "../credentials_provider"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]
