[package]
name = "picker"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/picker.rs"
doctest = false

[features]


[dependencies.anyhow]
version = "1.0.86"

[dependencies.db]
path = "../db"

[dependencies.language]
path = "../language"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.menu]
path = "../menu"

[dependencies.project]
path = "../project"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.theme]
path = "../theme"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.ui]
path = "../ui"

[dependencies.ui_input]
path = "../ui_input"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"

[dependencies.util]
path = "../util"

[dev-dependencies.editor]
path = "../editor"


[dev-dependencies.gpui]
path = "../gpui"
default-features = false


[dev-dependencies.settings]
path = "../settings"
