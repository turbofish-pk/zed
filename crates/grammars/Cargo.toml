[package]
name = "grammars"
version = "0.1.0"
publish = false

[package.edition]
workspace = true

[lints]
workspace = true

[lib]
path = "src/grammars.rs"
test = false
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.language_core]
path = "../language_core"

[dependencies.rust-embed]
version = "8.11"
features = ["include-exclude", "compression"]

[dependencies.util]
path = "../util"

[dependencies.tree-sitter]
git = "https://github.com/tree-sitter/tree-sitter"
rev = "803c6ebaac27d69e1808b45058482e868d073ceb"
optional = true

[dependencies.tree-sitter-bash]
version = "0.25.1"
optional = true

[dependencies.tree-sitter-c]
version = "0.24.1"
optional = true

[dependencies.tree-sitter-cpp]
git = "https://github.com/tree-sitter/tree-sitter-cpp"
rev = "5cb9b693cfd7bfacab1d9ff4acac1a4150700609"
optional = true

[dependencies.tree-sitter-css]
version = "0.23"
optional = true

[dependencies.tree-sitter-diff]
version = "0.1.0"
optional = true

[dependencies.tree-sitter-gitcommit]
git = "https://github.com/zed-industries/tree-sitter-git-commit"
rev = "88309716a69dd13ab83443721ba6e0b491d37ee9"
optional = true

[dependencies.tree-sitter-go]
git = "https://github.com/zed-industries/tree-sitter-go"
rev = "6862a49e3c5a7567a6c576420e9a8f944e198a85"
optional = true

[dependencies.tree-sitter-go-mod]
git = "https://github.com/camdencheek/tree-sitter-go-mod"
rev = "2e886870578eeba1927a2dc4bd2e2b3f598c5f9a"
package = "tree-sitter-gomod"
optional = true

[dependencies.tree-sitter-gowork]
git = "https://github.com/zed-industries/tree-sitter-go-work"
rev = "acb0617bf7f4fda02c6217676cc64acb89536dc7"
optional = true

[dependencies.tree-sitter-jsdoc]
version = "0.23"
optional = true

[dependencies.tree-sitter-json]
version = "0.24"
optional = true

[dependencies.tree-sitter-md]
git = "https://github.com/zed-industries/tree-sitter-markdown"
rev = "b596e737286780d7bfa9fcddceaeeb754574b352"
optional = true

[dependencies.tree-sitter-python]
version = "0.25"
optional = true

[dependencies.tree-sitter-regex]
version = "0.24"
optional = true

[dependencies.tree-sitter-rust]
version = "0.24.2"
optional = true

[dependencies.tree-sitter-typescript]
git = "https://github.com/zed-industries/tree-sitter-typescript"
rev = "e2c53597d6a5d9cf7bbe8dccde576fe1e46c5899"
optional = true

[dependencies.tree-sitter-yaml]
git = "https://github.com/zed-industries/tree-sitter-yaml"
rev = "baff0b51c64ef6a1fb1f8390f3ad6015b83ec13a"
optional = true

[features]
load-grammars = ["tree-sitter", "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-css", "tree-sitter-diff", "tree-sitter-gitcommit", "tree-sitter-go", "tree-sitter-go-mod", "tree-sitter-gowork", "tree-sitter-jsdoc", "tree-sitter-json", "tree-sitter-md", "tree-sitter-python", "tree-sitter-regex", "tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-yaml"]
