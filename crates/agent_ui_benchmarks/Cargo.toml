[package]
name = "agent_ui_benchmarks"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["futures", "gpui_platform"]

[lints]
workspace = true

[dev-dependencies.collections]
path = "../collections"
version = "0.1.0"

[dev-dependencies.criterion]
version = "0.8.2"
features = ["html_reports"]

[dev-dependencies.futures]
version = "0.3.34"

[dev-dependencies.fuzzy_nucleo]
path = "../fuzzy_nucleo"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["bench-support"]

[dev-dependencies.gpui_platform]
path = "../gpui_platform"
default-features = false
features = ["bench-support"]

[dev-dependencies.ordered-float]
version = "5"

[[bench]]
name = "model_search"
harness = false
