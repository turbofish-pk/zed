[package]
name = "copilot_ui"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/copilot_ui.rs"
doctest = false
test = false

[features]
default = []
test-support = ["copilot/test-support", "gpui/test-support"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.copilot]
path = "../copilot"

[dependencies.copilot_chat]
path = "../copilot_chat"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.lsp]
path = "../lsp"

[dependencies.menu]
path = "../menu"

[dependencies.project]
path = "../project"

[dependencies.release_channel]
path = "../release_channel"

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"
