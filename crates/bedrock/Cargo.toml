[package]
name = "bedrock"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/bedrock.rs"
doctest = false

[features]
default = []
schemars = ["dep:schemars"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.aws-sdk-bedrockruntime]
version = "1.112.0"
default-features = false
features = ["behavior-version-latest", "rt-tokio"]

[dependencies.aws-smithy-types]
version = "1.3.4"
features = ["http-body-1-x"]

[dependencies.futures]
version = "0.3.34"

[dependencies.http_client]
path = "../http_client"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2", "derive"]
optional = true

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.thiserror]
version = "2.0.12"
