[package]
description = "The fast, collaborative code editor."
name = "zed"
version = "1.27.0"
license = "GPL-3.0-or-later"
authors = ["Zed Team <hi@zed.dev>"]
default-run = "zed"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[features]
tracy = ["ztracing/tracy"]
track-project-leak = ["gpui/leak-detection"]
mimalloc = ["dep:mimalloc"]

[[bin]]
name = "zed"
path = "src/main.rs"

[dependencies.activity_indicator]
path = "../activity_indicator"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.ashpd]
version = "0.13"
default-features = false
features = [
    "async-io",
    "inhibit",
    "open_uri",
    "file_chooser",
    "settings",
    "notification",
]

[dependencies.askpass]
path = "../askpass"

[dependencies.assets]
path = "../assets"

[dependencies.breadcrumbs]
path = "../breadcrumbs"

[dependencies.call_hierarchy]
path = "../call_hierarchy"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.clap]
version = "4.4"
features = ["derive", "wrap_help"]

[dependencies.cli]
path = "../cli"
default-features = false

[dependencies.client]
path = "../client"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.command_palette]
path = "../command_palette"

[dependencies.component_preview]
path = "../component_preview"

[dependencies.dap_adapters]
path = "../dap_adapters"

[dependencies.db]
path = "../db"

[dependencies.debug_adapter_extension]
path = "../debug_adapter_extension"

[dependencies.debugger_tools]
path = "../debugger_tools"

[dependencies.debugger_ui]
path = "../debugger_ui"

[dependencies.diagnostics]
path = "../diagnostics"

[dependencies.editor]
path = "../editor"

[dependencies.encoding_selector]
path = "../encoding_selector"

[dependencies.extension]
path = "../extension"

[dependencies.extension_host]
path = "../extension_host"

[dependencies.extensions_ui]
path = "../extensions_ui"

[dependencies.feature_flags]
path = "../feature_flags"

[dependencies.file_finder]
path = "../file_finder"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.git]
path = "../git"

[dependencies.git_hosting_providers]
path = "../git_hosting_providers"

[dependencies.git_ui]
path = "../git_ui"

[dependencies.git_ui_core]
path = "../git_ui_core"

[dependencies.go_to_line]
path = "../go_to_line"

[dependencies.gpui]
path = "../gpui"
default-features = false
features = ["stacker", "wayland"]

[dependencies.gpui_platform]
path = "../gpui_platform"
default-features = false
features = ["font-kit", "wayland"]

[dependencies.gpui_tokio]
path = "../gpui_tokio"

[dependencies.image]
version = "0.25.1"
default-features = false
features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
]

[dependencies.image_viewer]
path = "../image_viewer"

[dependencies.inspector_ui]
path = "../inspector_ui"

[dependencies.install_cli]
path = "../install_cli"

[dependencies.journal]
path = "../journal"

[dependencies.json_schema_store]
path = "../json_schema_store"

[dependencies.keymap_editor]
path = "../keymap_editor"

[dependencies.language]
path = "../language"

[dependencies.language_extension]
path = "../language_extension"

[dependencies.language_onboarding]
path = "../language_onboarding"

[dependencies.language_selector]
path = "../language_selector"

[dependencies.language_tools]
path = "../language_tools"

[dependencies.languages]
path = "../languages"
features = ["load-grammars"]

[dependencies.line_ending_selector]
path = "../line_ending_selector"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.lsp_command_selector]
path = "../lsp_command_selector"

[dependencies.lsp_locations]
path = "../lsp_locations"

[dependencies.markdown]
path = "../markdown"

[dependencies.markdown_preview]
path = "../markdown_preview"

[dependencies.menu]
path = "../menu"

[dependencies.migrator]
path = "../migrator"

[dependencies.mimalloc]
version = "0.1"
optional = true

[dependencies.node_runtime]
path = "../node_runtime"

[dependencies.notifications]
path = "../notifications"

[dependencies.onboarding]
path = "../onboarding"

[dependencies.outline]
path = "../outline"

[dependencies.outline_panel]
path = "../outline_panel"

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.paths]
path = "../paths"

[dependencies.picker]
path = "../picker"

[dependencies.project]
path = "../project"

[dependencies.project_panel]
path = "../project_panel"

[dependencies.project_symbols]
path = "../project_symbols"

[dependencies.rayon]
version = "1.8"

[dependencies.recent_projects]
path = "../recent_projects"

[dependencies.release_channel]
path = "../release_channel"

[dependencies.repl]
path = "../repl"

[dependencies.reqwest_client]
path = "../reqwest_client"

[dependencies.rope]
path = "../rope"

[dependencies.sandbox]
path = "../sandbox"

[dependencies.search]
path = "../search"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.session]
path = "../session"

[dependencies.settings]
path = "../settings"

[dependencies.settings_profile_selector]
path = "../settings_profile_selector"

[dependencies.settings_ui]
path = "../settings_ui"

[dependencies.shellexpand]
version = "3.1"

[dependencies.smol]
version = "2.0"

[dependencies.snippet_provider]
path = "../snippet_provider"

[dependencies.snippets_ui]
path = "../snippets_ui"

[dependencies.svg_preview]
path = "../svg_preview"

[dependencies.system_specs]
path = "../system_specs"

[dependencies.tab_switcher]
path = "../tab_switcher"

[dependencies.tabular_data_preview]
path = "../tabular_data_preview"

[dependencies.tasks_ui]
path = "../tasks_ui"

[dependencies.terminal_view]
path = "../terminal_view"

[dependencies.theme]
path = "../theme"

[dependencies.theme_extension]
path = "../theme_extension"

[dependencies.theme_selector]
path = "../theme_selector"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.time]
version = "0.3"
features = [
    "macros",
    "parsing",
    "serde",
    "serde-well-known",
    "formatting",
    "local-offset",
]

[dependencies.title_bar]
path = "../title_bar"

[dependencies.toolchain_selector]
path = "../toolchain_selector"

[dependencies.ui]
path = "../ui"

[dependencies.url]
version = "2.2"

[dependencies.urlencoding]
version = "2.1.2"

[dependencies.util]
path = "../util"

[dependencies.uuid]
version = "1.1"
features = ["serde"]

[dependencies.vim]
path = "../vim"

[dependencies.vim_mode_setting]
path = "../vim_mode_setting"

[dependencies.watch]
path = "../watch"

[dependencies.which_key]
path = "../which_key"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"

[dependencies.zed_env_vars]
path = "../zed_env_vars"

[dependencies.zlog]
path = "../zlog"

[dependencies.zlog_settings]
path = "../zlog_settings"

[dependencies.ztracing]
path = "../ztracing"

[build-dependencies.image]
version = "0.25.1"
default-features = false
features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
]

[build-dependencies.pkg-config]
version = "0.3.22"