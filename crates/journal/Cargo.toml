[package]
name = "journal"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/journal.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.editor]
path = "../editor"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.settings]
path = "../settings"

[dependencies.shellexpand]
version = "3.1"

[dependencies.workspace]
path = "../workspace"

[dev-dependencies.editor]
path = "../editor"
features = ["test-support"]
