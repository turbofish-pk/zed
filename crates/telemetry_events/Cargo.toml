[package]
name = "telemetry_events"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/telemetry_events.rs"
test = false
doctest = false

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.serde]
version = "1.0"
features = ["rc", "derive"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]
