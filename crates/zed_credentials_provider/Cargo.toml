[package]
name = "zed_credentials_provider"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/zed_credentials_provider.rs"
test = false
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.credentials_provider]
path = "../credentials_provider"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.paths]
path = "../paths"

[dependencies.release_channel]
path = "../release_channel"

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]
