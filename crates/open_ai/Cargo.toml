[package]
name = "open_ai"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/open_ai.rs"
doctest = false

[features]
default = []
schemars = ["dep:schemars"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.futures]
version = "0.3.34"

[dependencies.http_client]
path = "../http_client"

[dependencies.language_model_core]
path = "../language_model_core"

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng", "small_rng", "thread_rng"]

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]
optional = true

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.thiserror]
version = "2.0.12"

[dev-dependencies.http_client]
path = "../http_client"
features = ["test-support"]

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]
