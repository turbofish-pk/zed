[package]
name = "streaming_diff"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/streaming_diff.rs"
doctest = false

[dependencies.ordered-float]
version = "5"

[dependencies.rope]
path = "../rope"

[dev-dependencies.criterion]
version = "0.8.2"
features = ["html_reports"]

[dev-dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dev-dependencies.util]
path = "../util"
