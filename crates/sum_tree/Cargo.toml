[package]
name = "sum_tree"
version = "0.1.0"
publish = false
license = "Apache-2.0"
description = "A sum tree data structure, a concurrency-friendly B-tree"

[package.edition]
workspace = true

[package.metadata.cargo-shear]
ignored = ["tracing"]

[lints]
workspace = true

[lib]
path = "src/sum_tree.rs"
doctest = false

[dependencies.heapless]
version = "0.9.2"

[dependencies.rayon]
version = "1.8"

[dependencies.ztracing]
path = "../ztracing"

[dependencies.proptest]
version = "1.12.0"
features = ["attr-macro"]
optional = true

[dev-dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dev-dependencies.ctor]
version = "1.0.12"

[dev-dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dev-dependencies.proptest]
version = "1.12.0"
features = ["attr-macro"]

[dev-dependencies.zlog]
path = "../zlog"

[features]
