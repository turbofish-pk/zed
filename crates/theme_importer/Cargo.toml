[package]
name = "theme_importer"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[dependencies]
vscode_theme = "0.2.0"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.clap]
version = "4.4"
features = ["derive", "wrap_help"]

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.indexmap]
version = "2.7.0"
features = ["serde"]

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.palette]
version = "0.7.5"
default-features = false
features = ["std"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.serde_json_lenient]
version = "0.2"
features = ["preserve_order", "raw_value"]

[dependencies.simplelog]
version = "0.12"
default-features = false
features = ["termcolor"]

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.theme]
path = "../theme"

[dependencies.theme_settings]
path = "../theme_settings"
