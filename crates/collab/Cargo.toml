[package]
authors = ["Nathan Sobo <nathan@zed.dev>"]
default-run = "collab"
name = "collab"
version = "0.44.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["sea-orm-macros"]

[lints]
workspace = true

[[bin]]
name = "collab"

[features]
sqlite = ["sea-orm/sqlx-sqlite", "sqlx/sqlite"]
test-support = ["sqlite"]

[lib]
test = false
doctest = false

[[test]]
name = "collab_tests"
required-features = ["test-support"]
path = "tests/integration/collab_tests.rs"

[dependencies]
aws-config = "1.1.5"
envy = "0.4.2"
prometheus = "0.14"
sea-orm-macros = "=1.1.10"
tower = "0.4"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-trait]
version = "0.1"

[dependencies.async-tungstenite]
version = "0.33"
features = ["tokio", "tokio-rustls-manual-roots"]

[dependencies.aws-sdk-kinesis]
version = "1.51"
default-features = false
features = ["default-https-client", "rt-tokio"]

[dependencies.aws-sdk-s3]
version = "1.15"
default-features = false
features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"]

[dependencies.axum]
version = "0.6"
features = ["json", "headers", "ws"]

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.clock]
path = "../clock"

[dependencies.cloud_api_types]
path = "../cloud_api_types"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.dashmap]
version = "6.0"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.hex]
version = "0.4.3"

[dependencies.livekit_api]
path = "../livekit_api"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.nanoid]
version = "0.4"

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.prost]
version = "0.14"

[dependencies.reqwest]
version = "0.11"
features = ["json"]

[dependencies.rpc]
path = "../rpc"

[dependencies.sea-orm]
version = "=1.1.10"
default-features = false
features = ["sqlx-postgres", "runtime-tokio-rustls", "with-uuid", "macros", "with-json", "with-chrono", "with-time"]

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.sha2]
version = "0.10"

[dependencies.sqlx]
version = "0.8"
default-features = false
features = ["any", "migrate"]

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.telemetry_events]
path = "../telemetry_events"

[dependencies.text]
path = "../text"

[dependencies.time]
version = "0.3"
features = ["macros", "parsing", "serde", "serde-well-known", "formatting", "local-offset"]

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.toml]
version = "0.9"
default-features = false
features = ["std", "serde", "parse"]

[dependencies.tower-http]
version = "0.4.4"
features = ["trace"]

[dependencies.tracing]
version = "0.1.40"

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter", "json"]

[dependencies.util]
path = "../util"

[dependencies.uuid]
version = "1.1"
features = ["serde"]

[dev-dependencies.async-channel]
version = "2.5"
default-features = false

[dev-dependencies.async-trait]
version = "0.1"

[dev-dependencies.buffer_diff]
path = "../buffer_diff"

[dev-dependencies.call]
path = "../call"
features = ["test-support"]

[dev-dependencies.channel]
path = "../channel"

[dev-dependencies.client]
path = "../client"
features = ["test-support"]

[dev-dependencies.collab]
path = ""
features = ["test-support"]

[dev-dependencies.collab_ui]
path = "../collab_ui"
features = ["test-support"]

[dev-dependencies.collections]
path = "../collections"
version = "0.1.0"
features = ["test-support"]

[dev-dependencies.command_palette_hooks]
path = "../command_palette_hooks"

[dev-dependencies.ctor]
version = "1.0.12"

[dev-dependencies.dap]
path = "../dap"
features = ["test-support"]

[dev-dependencies.dap_adapters]
path = "../dap_adapters"
features = ["test-support"]

[dev-dependencies.debugger_ui]
path = "../debugger_ui"
features = ["test-support"]

[dev-dependencies.editor]
path = "../editor"
features = ["test-support"]

[dev-dependencies.extension]
path = "../extension"

[dev-dependencies.file_finder]
path = "../file_finder"

[dev-dependencies.fs]
path = "../fs"
features = ["test-support"]

[dev-dependencies.git]
path = "../git"
features = ["test-support"]

[dev-dependencies.git_hosting_providers]
path = "../git_hosting_providers"

[dev-dependencies.git_ui]
path = "../git_ui"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.gpui_tokio]
path = "../gpui_tokio"

[dev-dependencies.http_client]
path = "../http_client"

[dev-dependencies.indoc]
version = "2"

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.language_model]
path = "../language_model"
features = ["test-support"]

[dev-dependencies.livekit_client]
path = "../livekit_client"
features = ["test-support"]

[dev-dependencies.lsp]
path = "../lsp"
features = ["test-support"]

[dev-dependencies.menu]
path = "../menu"

[dev-dependencies.multi_buffer]
path = "../multi_buffer"
features = ["test-support"]

[dev-dependencies.node_runtime]
path = "../node_runtime"

[dev-dependencies.notifications]
path = "../notifications"
features = ["test-support"]

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dev-dependencies.recent_projects]
path = "../recent_projects"
features = ["test-support"]

[dev-dependencies.release_channel]
path = "../release_channel"

[dev-dependencies.remote]
path = "../remote"
features = ["test-support"]

[dev-dependencies.remote_server]
path = "../remote_server"

[dev-dependencies.rpc]
path = "../rpc"
features = ["test-support"]

[dev-dependencies.sea-orm]
version = "=1.1.10"
default-features = false

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.session]
path = "../session"
features = ["test-support"]

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]

[dev-dependencies.sqlx]
version = "0.8"
default-features = false

[dev-dependencies.task]
path = "../task"

[dev-dependencies.theme]
path = "../theme"

[dev-dependencies.theme_settings]
path = "../theme_settings"
features = ["test-support"]

[dev-dependencies.title_bar]
path = "../title_bar"
features = ["test-support"]

[dev-dependencies.unindent]
version = "0.2.0"

[dev-dependencies.util]
path = "../util"

[dev-dependencies.workspace]
path = "../workspace"
features = ["test-support"]

[dev-dependencies.worktree]
path = "../worktree"
features = ["test-support"]

[dev-dependencies.zed_actions]
path = "../zed_actions"

[dev-dependencies.zlog]
path = "../zlog"
