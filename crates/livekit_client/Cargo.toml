[package]
name = "livekit_client"
version = "0.1.0"
description = "Logic for using LiveKit with GPUI"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["serde_json"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[[example]]
name = "test_app"

[features]
test-support = ["collections/test-support", "gpui/test-support", "livekit_api/test-support", "dep:nanoid", "dep:postage"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-trait]
version = "0.1"

[dependencies.audio]
path = "../audio"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.cpal]
git = "https://github.com/RustAudio/cpal"
rev = "e1612d5d98152f8dc2a62e1b51ef7cbf4f7f26b7"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false
features = ["screen-capture", "x11", "wayland"]

[dependencies.gpui_tokio]
path = "../gpui_tokio"

[dependencies.http_client_tls]
path = "../http_client_tls"

[dependencies.image]
version = "0.25.1"
default-features = false
features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"]

[dependencies.livekit_api]
path = "../livekit_api"
optional = true

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.nanoid]
version = "0.4"
optional = true

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.postage]
version = "0.5"
default-features = false
features = ["futures-traits", "logging", "blocking"]
optional = true

[dependencies.rodio]
git = "https://github.com/RustAudio/rodio"
rev = "3ee9745862279ce1d18db593155016e7ce024aeb"
default-features = false
features = ["wav", "playback", "wav_output", "recording"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_urlencoded]
version = "0.7"

[dependencies.settings]
path = "../settings"

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[target.'cfg(any(all(target_os = "windows", target_env = "gnu"), target_os = "freebsd"))'.dependencies.livekit_api]
path = "../livekit_api"

[target.'cfg(any(all(target_os = "windows", target_env = "gnu"), target_os = "freebsd"))'.dependencies.nanoid]
version = "0.4"

[target.'cfg(any(all(target_os = "windows", target_env = "gnu"), target_os = "freebsd"))'.dependencies.postage]
version = "0.5"
default-features = false
features = ["futures-traits", "logging", "blocking"]

[target.'cfg(not(any(all(target_os = "windows", target_env = "gnu"), target_os = "freebsd")))'.dependencies.libwebrtc]
version = "0.3.26"

[target.'cfg(not(any(all(target_os = "windows", target_env = "gnu"), target_os = "freebsd")))'.dependencies.livekit]
version = "0.7.32"
features = ["tokio", "rustls-tls-native-roots"]

[target.'cfg(target_os = "linux")'.dependencies.tokio]
version = "1"
features = ["time"]

[target.'cfg(target_os = "linux")'.dependencies.webrtc-sys]
version = "0.3.23"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "windows"))'.dependencies.scap]
git = "https://github.com/zed-industries/scap"
rev = "b5c86ec58dd4b6b7732bf6ac8be03d6b1f190a82"
default-features = false
package = "zed-scap"
version = "0.0.8-zed"

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
version = "=0.3.2"
default-features = false
features = ["CFDictionary", "CFNumber"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-video]
version = "=0.3.2"
default-features = false
features = ["CVBuffer", "CVImageBuffer", "CVBase", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVPixelBufferPool", "CVReturn"]

[target.'cfg(target_os = "macos")'.dependencies.coreaudio-rs]
version = "0.12"
default-features = false
features = ["core_audio"]

[dev-dependencies.collections]
path = "../collections"
version = "0.1.0"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.gpui_platform]
path = "../gpui_platform"
default-features = false

[dev-dependencies.livekit_api]
path = "../livekit_api"
features = ["test-support"]

[dev-dependencies.nanoid]
version = "0.4"

[dev-dependencies.postage]
version = "0.5"
default-features = false
features = ["futures-traits", "logging"]

[dev-dependencies.simplelog]
version = "0.12"
default-features = false

[build-dependencies.serde]
version = "1.0"
features = ["rc", "derive"]

[build-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]
