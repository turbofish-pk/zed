[package]
name = "worktree"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["tracing"]

[lib]
path = "src/worktree.rs"
doctest = false

[[test]]
name = "integration"
required-features = ["test-support"]
path = "tests/integration/worktree_tests.rs"

[lints]
workspace = true

[features]
test-support = ["gpui/test-support", "language/test-support", "pretty_assertions", "settings/test-support", "text/test-support", "util/test-support"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-channel]
version = "2.5"
default-features = false

[dependencies.async-lock]
version = "3.4"
default-features = false

[dependencies.clock]
path = "../clock"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.encoding_rs]
version = "0.8"

[dependencies.file_content]
path = "../file_content"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.futures-lite]
version = "2"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.git]
path = "../git"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.ignore]
version = "0.4.22"

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.paths]
path = "../paths"

[dependencies.postage]
version = "0.5"
default-features = false

[dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]
optional = true

[dependencies.rpc]
path = "../rpc"
features = ["gpui"]

[dependencies.settings]
path = "../settings"

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.sum_tree]
path = "../sum_tree"

[dependencies.text]
path = "../text"

[dependencies.tracing]
version = "0.1.40"

[dependencies.util]
path = "../util"

[dependencies.ztracing]
path = "../ztracing"

[dev-dependencies.clock]
path = "../clock"
features = ["test-support"]

[dev-dependencies.collections]
path = "../collections"
version = "0.1.0"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.paths]
path = "../paths"
features = ["test-support"]

[dev-dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dev-dependencies.rpc]
path = "../rpc"
features = ["test-support"]

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]

[dev-dependencies.util]
path = "../util"
features = ["test-support"]

[dev-dependencies.worktree]
path = ""
features = ["test-support"]

[dev-dependencies.zlog]
path = "../zlog"
