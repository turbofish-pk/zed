[package]
name = "editor"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/editor.rs"
doctest = false

[features]
test-support = ["text/test-support", "language/test-support", "gpui/test-support", "multi_buffer/test-support", "project/test-support", "theme/test-support", "util/test-support", "workspace/test-support", "tree-sitter-c", "tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-html", "proptest", "unindent", "dep:pretty_assertions", "dep:assets", "dep:indoc"]

[dependencies.aho-corasick]
version = "1.1"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.assets]
path = "../assets"
optional = true

[dependencies.base64]
version = "0.22"

[dependencies.breadcrumbs]
path = "../breadcrumbs"

[dependencies.client]
path = "../client"

[dependencies.clock]
path = "../clock"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.convert_case]
version = "0.11.0"

[dependencies.dap]
path = "../dap"

[dependencies.db]
path = "../db"

[dependencies.buffer_diff]
path = "../buffer_diff"

[dependencies.emojis]
version = "0.9"

[dependencies.feature_flags]
path = "../feature_flags"

[dependencies.file_icons]
path = "../file_icons"

[dependencies.futures]
version = "0.3.34"

[dependencies.futures-lite]
version = "2"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.fs]
path = "../fs"

[dependencies.git]
path = "../git"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.indoc]
version = "2"
optional = true

[dependencies.edit_prediction_types]
path = "../edit_prediction_types"

[dependencies.itertools]
version = "0.14.0"

[dependencies.language]
path = "../language"

[dependencies.language_detection]
path = "../language_detection"

[dependencies.linkify]
version = "0.10.0"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.lsp]
path = "../lsp"

[dependencies.markdown]
path = "../markdown"

[dependencies.menu]
path = "../menu"

[dependencies.multi_buffer]
path = "../multi_buffer"

[dependencies.ordered-float]
version = "5"

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]
optional = true

[dependencies.project]
path = "../project"

[dependencies.proptest]
version = "1.12.0"
features = ["attr-macro"]
optional = true

[dependencies.proptest-derive]
version = "0.8.0"
optional = true

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dependencies.regex]
version = "1.5"
default-features = false
features = ["std", "perf"]

[dependencies.rpc]
path = "../rpc"

[dependencies.rope]
path = "../rope"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.snippet]
path = "../snippet"

[dependencies.sum_tree]
path = "../sum_tree"

[dependencies.task]
path = "../task"

[dependencies.telemetry]
path = "../telemetry"

[dependencies.text]
path = "../text"

[dependencies.theme]
path = "../theme"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.tree-sitter-c]
version = "0.24.1"
optional = true

[dependencies.tree-sitter-html]
version = "0.23"
optional = true

[dependencies.tree-sitter-rust]
version = "0.24.2"
optional = true

[dependencies.tree-sitter-typescript]
git = "https://github.com/zed-industries/tree-sitter-typescript"
rev = "e2c53597d6a5d9cf7bbe8dccde576fe1e46c5899"
optional = true

[dependencies.tree-sitter-python]
version = "0.25"
optional = true

[dependencies.ztracing]
path = "../ztracing"

[dependencies.unicode-segmentation]
version = "1.10"

[dependencies.unicode-script]
version = "0.5.7"

[dependencies.unindent]
version = "0.2.0"
optional = true

[dependencies.ui]
path = "../ui"

[dependencies.ui_input]
path = "../ui_input"

[dependencies.url]
version = "2.2"

[dependencies.urlencoding]
version = "2.1.2"

[dependencies.util]
path = "../util"

[dependencies.uuid]
version = "1.1"
features = ["serde"]

[dependencies.vim_mode_setting]
path = "../vim_mode_setting"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"

