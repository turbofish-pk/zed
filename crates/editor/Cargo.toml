features = ["test-support"]

[dev-dependencies.indoc]
version = "2"

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.languages]
path = "../languages"
features = ["test-support"]

[dev-dependencies.lsp]
path = "../lsp"
features = ["test-support"]

[dev-dependencies.markdown]
path = "../markdown"
features = ["test-support"]

[dev-dependencies.multi_buffer]
path = "../multi_buffer"
features = ["test-support"]

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.proptest]
version = "1.12.0"
features = ["attr-macro"]

[dev-dependencies.proptest-derive]
version = "0.8.0"

[dev-dependencies.release_channel]
path = "../release_channel"

[dev-dependencies.rand]
