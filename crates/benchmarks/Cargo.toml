[package]
name = "benchmarks"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["gpui_platform"]

[lib]
path = "src/benchmarks.rs"
doctest = false
test = false

[lints]
workspace = true

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dev-dependencies.action_log]
path = "../action_log"

[dev-dependencies.agent]
path = "../agent"
features = ["test-support"]

[dev-dependencies.agent_settings]
path = "../agent_settings"

[dev-dependencies.assets]
path = "../assets"

[dev-dependencies.criterion]
version = "0.8.2"
features = ["html_reports"]

[dev-dependencies.editor]
path = "../editor"
features = ["test-support"]

[dev-dependencies.futures]
version = "0.3.34"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["bench-support"]

[dev-dependencies.gpui_platform]
path = "../gpui_platform"
default-features = false
features = ["bench-support", "font-kit"]

[dev-dependencies.indoc]
version = "2"

[dev-dependencies.itertools]
version = "0.14.0"

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.language_model]
path = "../language_model"
features = ["test-support"]

[dev-dependencies.lsp]
path = "../lsp"
features = ["test-support"]

[dev-dependencies.markdown]
path = "../markdown"

[dev-dependencies.multi_buffer]
path = "../multi_buffer"

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.prompt_store]
path = "../prompt_store"

[dev-dependencies.rpc]
path = "../rpc"

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]

[dev-dependencies.text]
path = "../text"

[dev-dependencies.theme]
path = "../theme"
features = ["test-support"]

[dev-dependencies.theme_settings]
path = "../theme_settings"

[dev-dependencies.ui]
path = "../ui"

[dev-dependencies.util]
path = "../util"
features = ["test-support"]

[dev-dependencies.zed_actions]
path = "../zed_actions"

[[bench]]
name = "editor_render"
harness = false

[[bench]]
name = "display_map"
harness = false

[[bench]]
name = "edit_file_tool"
harness = false

[[bench]]
name = "markdown_renderer"
harness = false
