[package]
description = "Shared logic for communication between the Zed app and the zed.dev server"
name = "rpc"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/rpc.rs"
doctest = false

[features]
gpui = ["dep:gpui"]


[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-tungstenite]
version = "0.33"

[dependencies.base64]
version = "0.22"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false
optional = true

[dependencies.gpui_util]
path = "../gpui_util"

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.proto]
path = "../proto"

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dependencies.rsa]
version = "0.9"
default-features = false
features = ["std", "u64_digit"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.sha2]
version = "0.10"

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.tracing]
version = "0.1"
default-features = false
features = ["std", "log"]

[dependencies.zstd]
version = "0.13"
default-features = false
features = ["legacy", "arrays"]

[dev-dependencies.collections]
path = "../collections"
version = "0.1.0"


[dev-dependencies.gpui]
path = "../gpui"
default-features = false


[dev-dependencies.proto]
path = "../proto"


[dev-dependencies.zlog]
path = "../zlog"
