[package]
name = "agent"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["editor"]

[lib]
path = "src/agent.rs"
doctest = false

[features]
test-support = ["db/test-support"]
unit-eval = []
e2e = []

[lints]
workspace = true

[dependencies.acp_thread]
path = "../acp_thread"

[dependencies.action_log]
path = "../action_log"

[dependencies.async-channel]
version = "2.5"
default-features = false

[dependencies.agent-client-protocol]
version = "=3.5.0"
features = ["schemars", "unstable", "unstable_protocol_v2"]

[dependencies.agent_servers]
path = "../agent_servers"

[dependencies.agent_settings]
path = "../agent_settings"

[dependencies.agent_skills]
path = "../agent_skills"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.client]
path = "../client"

[dependencies.cloud_api_types]
path = "../cloud_api_types"

[dependencies.cloud_llm_client]
path = "../cloud_llm_client"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.context_server]
path = "../context_server"

[dependencies.db]
path = "../db"

[dependencies.feature_flags]
path = "../feature_flags"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.git]
path = "../git"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.handlebars]
version = "4.3"
features = ["rust-embed"]

[dependencies.heck]
version = "0.5"

[dependencies.html_to_markdown]
path = "../html_to_markdown"

[dependencies.http_client]
path = "../http_client"

[dependencies.http_proxy]
path = "../http_proxy"

[dependencies.indoc]
version = "2"

[dependencies.itertools]
version = "0.14.0"

[dependencies.language]
path = "../language"

[dependencies.language_model]
path = "../language_model"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.paths]
path = "../paths"

[dependencies.project]
path = "../project"

[dependencies.prompt_store]
path = "../prompt_store"

[dependencies.quick-xml]
version = "0.41"

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dependencies.regex]
version = "1.5"
default-features = false
features = ["std", "perf"]

[dependencies.sandbox]
path = "../sandbox"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.shell_command_parser]
path = "../shell_command_parser"

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.sqlez]
path = "../sqlez"

[dependencies.streaming_diff]
path = "../streaming_diff"

[dependencies.strsim]
version = "0.11"

[dependencies.task]
path = "../task"

[dependencies.telemetry]
path = "../telemetry"

[dependencies.tempfile]
version = "3.20.0"

[dependencies.text]
path = "../text"

[dependencies.thiserror]
version = "2.0.12"

[dependencies.ui]
path = "../ui"

[dependencies.url]
version = "2.2"

[dependencies.util]
path = "../util"

[dependencies.uuid]
version = "1.1"
features = ["serde"]

[dependencies.watch]
path = "../watch"

[dependencies.web_search]
path = "../web_search"

[dependencies.zed_env_vars]
path = "../zed_env_vars"

[dependencies.zstd]
version = "0.13"
default-features = false
features = ["legacy", "arrays"]

[target.'cfg(target_os = "windows")'.dependencies.release_channel]
path = "../release_channel"

[dev-dependencies.acp_thread]
path = "../acp_thread"
features = ["test-support"]

[dev-dependencies.async-io]
version = "2.6.0"

[dev-dependencies.agent_servers]
path = "../agent_servers"
features = ["test-support"]

[dev-dependencies.client]
path = "../client"
features = ["test-support"]

[dev-dependencies.clock]
path = "../clock"
features = ["test-support"]

[dev-dependencies.context_server]
path = "../context_server"
features = ["test-support"]

[dev-dependencies.ctor]
version = "1.0.12"

[dev-dependencies.db]
path = "../db"
features = ["test-support"]

[dev-dependencies.editor]
path = "../editor"
features = ["test-support"]

[dev-dependencies.env_logger]
version = "0.11"

[dev-dependencies.eval_utils]
path = "../eval_utils"

[dev-dependencies.fs]
path = "../fs"
features = ["test-support"]

[dev-dependencies.git]
path = "../git"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.gpui_tokio]
path = "../gpui_tokio"

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.language_model]
path = "../language_model"
features = ["test-support"]

[dev-dependencies.language_models]
path = "../language_models"

[dev-dependencies.lsp]
path = "../lsp"
features = ["test-support"]

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.proptest]
version = "1.12.0"
features = ["attr-macro"]

[dev-dependencies.reqwest_client]
path = "../reqwest_client"

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]

[dev-dependencies.theme]
path = "../theme"
features = ["test-support"]

[dev-dependencies.theme_settings]
path = "../theme_settings"

[dev-dependencies.unindent]
version = "0.2.0"

[dev-dependencies.zlog]
path = "../zlog"
