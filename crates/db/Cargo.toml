[package]
name = "db"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/db.rs"
doctest = false

[features]


[dependencies.anyhow]
version = "1.0.86"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.indoc]
version = "2"

[dependencies.inventory]
version = "0.3.19"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.paths]
path = "../paths"

[dependencies.release_channel]
path = "../release_channel"

[dependencies.sqlez]
path = "../sqlez"

[dependencies.sqlez_macros]
path = "../sqlez_macros"

[dependencies.util]
path = "../util"

[dependencies.uuid]
version = "1.1"
features = ["serde", "v5", "v7"]

[dependencies.zed_env_vars]
path = "../zed_env_vars"
