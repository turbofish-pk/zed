[package]
name = "languages"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
test-support = ["load-grammars"]
load-grammars = ["grammars/load-grammars", "tree-sitter", "tree-sitter-gitcommit"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-compression]
version = "0.4"
features = ["bzip2", "gzip", "futures-io"]

[dependencies.async-fs]
version = "2.1"

[dependencies.async-tar]
git = "https://github.com/zed-industries/async-tar"
rev = "bd3ad6f89df9a9da7a8535958756d6bf465936a0"

[dependencies.async-trait]
version = "0.1"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.futures]
version = "0.3.34"

[dependencies.globset]
version = "0.4"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.grammars]
path = "../grammars"

[dependencies.http_client]
path = "../http_client"
features = ["github-download"]

[dependencies.itertools]
version = "0.14.0"

[dependencies.json_schema_store]
path = "../json_schema_store"

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.lsp]
path = "../lsp"

[dependencies.node_runtime]
path = "../node_runtime"

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.pet-conda]
git = "https://github.com/zed-industries/python-environment-tools.git"
rev = "5aad7164bfc2a58977b103c8ef8fdd7302ed2e9f"

[dependencies.pet-core]
git = "https://github.com/zed-industries/python-environment-tools.git"
rev = "5aad7164bfc2a58977b103c8ef8fdd7302ed2e9f"

[dependencies.pet-fs]
git = "https://github.com/zed-industries/python-environment-tools.git"
rev = "5aad7164bfc2a58977b103c8ef8fdd7302ed2e9f"

[dependencies.pet-poetry]
git = "https://github.com/zed-industries/python-environment-tools.git"
rev = "5aad7164bfc2a58977b103c8ef8fdd7302ed2e9f"

[dependencies.pet-reporter]
git = "https://github.com/zed-industries/python-environment-tools.git"
rev = "5aad7164bfc2a58977b103c8ef8fdd7302ed2e9f"

[dependencies.pet-virtualenv]
git = "https://github.com/zed-industries/python-environment-tools.git"
rev = "5aad7164bfc2a58977b103c8ef8fdd7302ed2e9f"

[dependencies.pet]
git = "https://github.com/zed-industries/python-environment-tools.git"
rev = "5aad7164bfc2a58977b103c8ef8fdd7302ed2e9f"

[dependencies.project]
path = "../project"

[dependencies.regex]
version = "1.5"
default-features = false
features = ["std", "perf"]

[dependencies.rope]
path = "../rope"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.serde_json_lenient]
version = "0.2"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.smol]
version = "2.0"

[dependencies.snippet]
path = "../snippet"

[dependencies.task]
path = "../task"

[dependencies.terminal]
path = "../terminal"

[dependencies.theme]
path = "../theme"

[dependencies.tree-sitter]
git = "https://github.com/tree-sitter/tree-sitter"
rev = "803c6ebaac27d69e1808b45058482e868d073ceb"
features = ["wasm"]
optional = true

[dependencies.tree-sitter-gitcommit]
git = "https://github.com/zed-industries/tree-sitter-git-commit"
rev = "88309716a69dd13ab83443721ba6e0b491d37ee9"
optional = true

[dependencies.url]
version = "2.2"

[dependencies.util]
path = "../util"

[dev-dependencies.fs]
path = "../fs"
features = ["test-support"]

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.tempfile]
version = "3.20.0"

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]

[dev-dependencies.theme]
path = "../theme"
features = ["test-support"]

[dev-dependencies.tree-sitter-bash]
version = "0.25.1"

[dev-dependencies.tree-sitter-c]
version = "0.24.1"

[dev-dependencies.tree-sitter-cpp]
git = "https://github.com/tree-sitter/tree-sitter-cpp"
rev = "5cb9b693cfd7bfacab1d9ff4acac1a4150700609"

[dev-dependencies.tree-sitter-css]
version = "0.23"

[dev-dependencies.tree-sitter-go]
git = "https://github.com/zed-industries/tree-sitter-go"
rev = "6862a49e3c5a7567a6c576420e9a8f944e198a85"

[dev-dependencies.tree-sitter-python]
version = "0.25"

[dev-dependencies.tree-sitter-rust]
version = "0.24.2"

[dev-dependencies.tree-sitter-typescript]
git = "https://github.com/zed-industries/tree-sitter-typescript"
rev = "e2c53597d6a5d9cf7bbe8dccde576fe1e46c5899"

[dev-dependencies.tree-sitter]
git = "https://github.com/tree-sitter/tree-sitter"
rev = "803c6ebaac27d69e1808b45058482e868d073ceb"
features = ["wasm"]

[dev-dependencies.unindent]
version = "0.2.0"
