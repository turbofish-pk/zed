[package]
name = "node_runtime"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["async-std"]

[lints]
workspace = true

[lib]
path = "src/node_runtime.rs"
doctest = false

[features]
test-support = []

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-compression]
version = "0.4"
features = ["bzip2", "gzip", "futures-io"]

[dependencies.async-tar]
git = "https://github.com/zed-industries/async-tar"
rev = "bd3ad6f89df9a9da7a8535958756d6bf465936a0"

[dependencies.async-trait]
version = "0.1"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.futures]
version = "0.3.34"

[dependencies.http_client]
path = "../http_client"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.paths]
path = "../paths"

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.smol]
version = "2.0"

[dependencies.thiserror]
version = "2.0.12"

[dependencies.util]
path = "../util"

[dependencies.watch]
path = "../watch"

[dependencies.which]
version = "8"

[dev-dependencies.tempfile]
version = "3.20.0"

[target."cfg(windows)".dependencies.async-std]
version = "1.12"
features = ["unstable"]
