[package]
name = "command_palette"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[features]
test-support = ["db/test-support"]

[lib]
path = "src/command_palette.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.client]
path = "../client"

[dependencies.command_palette_hooks]
path = "../command_palette_hooks"

[dependencies.db]
path = "../db"

[dependencies.fuzzy_nucleo]
path = "../fuzzy_nucleo"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.menu]
path = "../menu"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.picker]
path = "../picker"

[dependencies.postage]
version = "0.5"
default-features = false

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.settings]
path = "../settings"

[dependencies.theme]
path = "../theme"

[dependencies.time]
version = "0.3"
features = ["macros", "parsing", "serde", "serde-well-known", "formatting", "local-offset"]

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.telemetry]
path = "../telemetry"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"

[dev-dependencies.db]
path = "../db"
features = ["test-support"]

[dev-dependencies.editor]
path = "../editor"
features = ["test-support"]

[dev-dependencies.go_to_line]
path = "../go_to_line"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.menu]
path = "../menu"

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.workspace]
path = "../workspace"
features = ["test-support"]

[dev-dependencies.theme_settings]
path = "../theme_settings"
