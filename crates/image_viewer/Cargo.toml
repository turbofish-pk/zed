[package]
name = "image_viewer"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/image_viewer.rs"
doctest = false

[features]
test-support = ["gpui/test-support", "editor/test-support"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.db]
path = "../db"

[dependencies.editor]
path = "../editor"

[dependencies.file_icons]
path = "../file_icons"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.menu]
path = "../menu"

[dependencies.project]
path = "../project"

[dependencies.settings]
path = "../settings"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dev-dependencies.editor]
path = "../editor"
features = ["test-support"]

[dev-dependencies.fs]
path = "../fs"

[dev-dependencies.theme]
path = "../theme"
