[package]
name = "tabular_data_preview"
version = "0.1.0"

[package.publish]
workspace = true

[package.edition]
workspace = true

[lib]
path = "src/tabular_data_preview.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.editor]
path = "../editor"

[dependencies.picker]
path = "../picker"

[dependencies.ui]
path = "../ui"

[dependencies.workspace]
path = "../workspace"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.indexmap]
version = "2.7.0"
features = ["serde"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.text]
path = "../text"

[dependencies.util]
path = "../util"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false


[dev-dependencies.project]
path = "../project"


[dev-dependencies.proptest]
version = "1.12.0"
features = ["attr-macro"]

[dev-dependencies.workspace]
path = "../workspace"


[features]
dev-tools = []

[lints]
workspace = true
