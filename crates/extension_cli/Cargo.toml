[package]
name = "extension_cli"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[[bin]]
name = "zed-extension"
path = "src/main.rs"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.clap]
version = "4.4"
features = ["derive", "wrap_help"]

[dependencies.cloud_api_types]
path = "../cloud_api_types"

[dependencies.env_logger]
version = "0.11"

[dependencies.extension]
path = "../extension"

[dependencies.futures]
version = "0.3.34"

[dependencies.fs]
path = "../fs"

[dependencies.gpui_platform]
path = "../gpui_platform"
default-features = false

[dependencies.http_client]
path = "../http_client"

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.reqwest_client]
path = "../reqwest_client"

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.serde_json_lenient]
version = "0.2"
features = ["preserve_order", "raw_value"]

[dependencies.settings_content]
path = "../settings_content"

[dependencies.snippet_provider]
path = "../snippet_provider"

[dependencies.task]
path = "../task"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.thiserror]
version = "2.0.12"

[dependencies.tokio]
version = "1"
features = ["fs", "macros", "parking_lot", "process", "sync", "time"]

[dependencies.toml]
version = "0.9"
default-features = false
features = ["std", "serde", "parse"]

[dependencies.tree-sitter]
git = "https://github.com/tree-sitter/tree-sitter"
rev = "803c6ebaac27d69e1808b45058482e868d073ceb"
features = ["wasm"]

[dependencies.wasmtime]
version = "48.0.7"
default-features = false
features = ["anyhow", "async", "demangle", "runtime", "cranelift", "component-model", "incremental-cache", "parallel-compilation"]
