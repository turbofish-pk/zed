[package]
name = "docs_preprocessor"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[dependencies.anyhow]
version = "1.0.86"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.jsonschema]
version = "0.51"
default-features = false

[dependencies.mdbook]
version = "=0.4.40"
default-features = false
features = ["search"]

[dependencies.regex]
version = "1.5"
default-features = false
features = ["std", "perf"]

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.util]
path = "../util"

[dependencies.zlog]
path = "../zlog"

[dependencies.task]
path = "../task"

[dependencies.theme]
path = "../theme"

[lints]
workspace = true

[[bin]]
name = "docs_preprocessor"
path = "src/main.rs"
