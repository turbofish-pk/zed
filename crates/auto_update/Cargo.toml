[package]
name = "auto_update"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/auto_update.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.client]
path = "../client"

[dependencies.db]
path = "../db"

[dependencies.futures-lite]
version = "2"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.http_client]
path = "../http_client"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.paths]
path = "../paths"

[dependencies.release_channel]
path = "../release_channel"

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.smol]
version = "2.0"

[dependencies.tempfile]
version = "3.20.0"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[target.'cfg(not(target_os = "windows"))'.dependencies.which]
version = "8"

[dev-dependencies.ctor]
version = "1.0.12"

[dev-dependencies.clock]
path = "../clock"
features = ["test-support"]

[dev-dependencies.futures]
version = "0.3.34"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.parking_lot]
version = "0.12.1"

[dev-dependencies.zlog]
path = "../zlog"
