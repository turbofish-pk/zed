[package]
name = "ai_onboarding"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["component"]

[lints]
workspace = true

[lib]
path = "src/ai_onboarding.rs"
test = false
doctest = false

[features]
default = []

[dependencies.client]
path = "../client"

[dependencies.cloud_api_types]
path = "../cloud_api_types"

[dependencies.component]
path = "../component"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language_model]
path = "../language_model"

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.telemetry]
path = "../telemetry"

[dependencies.ui]
path = "../ui"

[dependencies.zed_actions]
path = "../zed_actions"
