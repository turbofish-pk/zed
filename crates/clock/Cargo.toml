[package]
name = "clock"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/clock.rs"
doctest = false

[features]
test-support = ["dep:parking_lot"]

[dependencies.parking_lot]
version = "0.12.1"
optional = true

[dependencies.serde]
version = "1.0"
features = ["rc", "derive"]

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]
