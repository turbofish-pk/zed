[package]
name = "gpui_macros"
version = "0.1.0"
publish = false
license = "Apache-2.0"
description = "Macros used by gpui"

[package.edition]
workspace = true

[lints]
workspace = true

[features]
inspector = []

[lib]
path = "src/gpui_macros.rs"
proc-macro = true
doctest = true
test = false

[dependencies.heck]
version = "0.5"

[dependencies.proc-macro2]
version = "1.0.93"

[dependencies.quote]
version = "1.0.9"

[dependencies.syn]
version = "2.0"
default-features = false
features = ["proc-macro", "full", "extra-traits", "visit-mut"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["inspector"]
