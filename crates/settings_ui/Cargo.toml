[package]
name = "settings_ui"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["component"]

[lints]
workspace = true

[lib]
path = "src/settings_ui.rs"
doctest = false

[features]
default = []


[dependencies.anyhow]
version = "1.0.86"


[dependencies.client]
path = "../client"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.context_server]
path = "../context_server"


[dependencies.editor]
path = "../editor"

[dependencies.extension]
path = "../extension"

[dependencies.extension_host]
path = "../extension_host"

[dependencies.fs]
path = "../fs"

[dependencies.feature_flags]
path = "../feature_flags"

[dependencies.futures]
version = "0.3.34"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.heck]
version = "0.5"

[dependencies.http_client]
path = "../http_client"

[dependencies.http_proxy]
path = "../http_proxy"

[dependencies.itertools]
version = "0.14.0"

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.menu]
path = "../menu"

[dependencies.paths]
path = "../paths"

[dependencies.picker]
path = "../picker"

[dependencies.regex]
version = "1.5"
default-features = false
features = ["std", "perf"]

[dependencies.platform_title_bar]
path = "../platform_title_bar"

[dependencies.project]
path = "../project"

[dependencies.release_channel]
path = "../release_channel"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.search]
path = "../search"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.serde_yaml_ng]
version = "0.10"

[dependencies.settings]
path = "../settings"

[dependencies.shell_command_parser]
path = "../shell_command_parser"

[dependencies.strum]
version = "0.28"
features = ["derive"]


[dependencies.theme]
path = "../theme"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.ui]
path = "../ui"

[dependencies.url]
version = "2.2"

[dependencies.ui_input]
path = "../ui_input"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"

[dependencies.zed_credentials_provider]
path = "../zed_credentials_provider"


[dev-dependencies.fs]
path = "../fs"


[dev-dependencies.futures]
version = "0.3.34"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false

[dev-dependencies.paths]
path = "../paths"

[dev-dependencies.project]
path = "../project"


[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.settings]
path = "../settings"


[dev-dependencies.workspace]
path = "../workspace"
