[package]
name = "agent_ui"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/agent_ui.rs"
doctest = false

[features]
test-support = ["acp_thread/test-support", "eval_utils", "gpui/test-support", "language/test-support", "reqwest_client", "workspace/test-support", "agent/test-support"]
audio = ["dep:audio"]
unit-eval = []

[dependencies.acp_thread]
path = "../acp_thread"

[dependencies.action_log]
path = "../action_log"

[dependencies.agent-client-protocol]
version = "=3.5.0"
features = ["schemars", "unstable", "unstable_protocol_v2"]

[dependencies.agent]
path = "../agent"

[dependencies.async-channel]
version = "2.5"
default-features = false

[dependencies.agent_servers]
path = "../agent_servers"

[dependencies.agent_settings]
path = "../agent_settings"

[dependencies.agent_skills]
path = "../agent_skills"

[dependencies.ai_onboarding]
path = "../ai_onboarding"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.heapless]
version = "0.9.2"

[dependencies.audio]
path = "../audio"
optional = true

[dependencies.base64]
version = "0.22"

[dependencies.buffer_diff]
path = "../buffer_diff"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.client]
path = "../client"

[dependencies.clock]
path = "../clock"

[dependencies.cloud_api_types]
path = "../cloud_api_types"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.command_palette_hooks]
path = "../command_palette_hooks"

[dependencies.component]
path = "../component"

[dependencies.context_server]
path = "../context_server"

[dependencies.db]
path = "../db"

[dependencies.editor]
path = "../editor"

[dependencies.eval_utils]
path = "../eval_utils"
optional = true

[dependencies.extension]
path = "../extension"

[dependencies.extension_host]
path = "../extension_host"

[dependencies.feature_flags]
path = "../feature_flags"

[dependencies.file_icons]
path = "../file_icons"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.fuzzy_nucleo]
path = "../fuzzy_nucleo"

[dependencies.git]
path = "../git"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.gpui_tokio]
path = "../gpui_tokio"

[dependencies.html_to_markdown]
path = "../html_to_markdown"

[dependencies.http_client]
path = "../http_client"

[dependencies.idna]
version = "1.0"

[dependencies.indoc]
version = "2"

[dependencies.itertools]
version = "0.14.0"

[dependencies.jsonschema]
version = "0.51"
