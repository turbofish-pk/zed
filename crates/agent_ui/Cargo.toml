[dependencies.language]
path = "../language"

[dependencies.language_model]
path = "../language_model"

[dependencies.language_models]
path = "../language_models"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.lru]
version = "0.16"

[dependencies.lsp]
path = "../lsp"

[dependencies.markdown]
path = "../markdown"

[dependencies.menu]
path = "../menu"

[dependencies.multi_buffer]
