[dependencies.release_channel]
path = "../release_channel"

[dependencies.remote]
path = "../remote"

[dependencies.remote_connection]
path = "../remote_connection"

[dependencies.rope]
path = "../rope"

[dependencies.sandbox]
path = "../sandbox"

[dependencies.schemars]
