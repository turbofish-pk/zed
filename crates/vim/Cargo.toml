[package]
name = "vim"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/vim.rs"
doctest = false

[features]
neovim = ["nvim-rs", "async-compat", "async-trait", "tokio"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-compat]
version = "0.2.1"
optional = true

[dependencies.async-trait]
version = "0.1"
optional = true

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.command_palette]
path = "../command_palette"

[dependencies.command_palette_hooks]
path = "../command_palette_hooks"

[dependencies.db]
path = "../db"

[dependencies.editor]
path = "../editor"

[dependencies.futures]
version = "0.3.34"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.itertools]
version = "0.14.0"

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.multi_buffer]
path = "../multi_buffer"

[dependencies.nvim-rs]
git = "https://github.com/KillTheMule/nvim-rs"
rev = "764dd270c642f77f10f3e19d05cc178a6cbe69f3"
features = ["use_tokio"]
optional = true

[dependencies.picker]
path = "../picker"

[dependencies.project]
path = "../project"

[dependencies.regex]
version = "1.5"
default-features = false
features = ["std", "perf"]

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.search]
path = "../search"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.task]
path = "../task"

[dependencies.text]
path = "../text"

[dependencies.theme]
path = "../theme"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.menu]
path = "../menu"

[dependencies.tokio]
version = "1.15"
features = ["full"]
optional = true

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.vim_mode_setting]
path = "../vim_mode_setting"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"

[dev-dependencies.command_palette]
path = "../command_palette"


[dev-dependencies.editor]
path = "../editor"


[dev-dependencies.env_logger]
version = "0.11"

[dev-dependencies.git_ui]
path = "../git_ui"


[dev-dependencies.gpui]
path = "../gpui"
default-features = false


[dev-dependencies.indoc]
version = "2"

[dev-dependencies.language]
path = "../language"


[dev-dependencies.project]
path = "../project"


[dev-dependencies.lsp]
path = "../lsp"


[dev-dependencies.markdown_preview]
path = "../markdown_preview"

[dev-dependencies.parking_lot]
version = "0.12.1"

[dev-dependencies.project_panel]
path = "../project_panel"

[dev-dependencies.outline_panel]
path = "../outline_panel"

[dev-dependencies.release_channel]
path = "../release_channel"

[dev-dependencies.semver]
version = "1.0"
features = ["serde"]

[dev-dependencies.settings_ui]
path = "../settings_ui"

[dev-dependencies.settings]
path = "../settings"

[dev-dependencies.perf]
path = "../../tooling/perf"
default-features = false
features = ["cli"]

[dev-dependencies.util]
path = "../util"


[dev-dependencies.util_macros]
path = "../util_macros"

[dev-dependencies.workspace]
path = "../workspace"


[dev-dependencies.search]
path = "../search"
