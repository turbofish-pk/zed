[package]
name = "debugger_tools"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/debugger_tools.rs"
doctest = false

[features]


[dependencies.anyhow]
version = "1.0.86"

[dependencies.dap]
path = "../dap"

[dependencies.editor]
path = "../editor"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.project]
path = "../project"

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.smol]
version = "2.0"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"
