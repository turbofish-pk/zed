[package]
name = "settings_macros"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lib]
path = "src/settings_macros.rs"
proc-macro = true
test = false
doctest = false

[lints]
workspace = true

[features]
default = []

[dependencies.quote]
version = "1.0.9"

[dependencies.syn]
version = "2.0"
default-features = false
features = ["proc-macro", "derive", "full", "parsing", "printing"]
