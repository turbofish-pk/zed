[package]
name = "install_cli"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/install_cli.rs"
test = false
doctest = false

[features]
test-support = []

[dependencies.anyhow]
version = "1.0.86"

[dependencies.client]
path = "../client"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.release_channel]
path = "../release_channel"

[dependencies.smol]
version = "2.0"

[dependencies.util]
path = "../util"

[target.'cfg(not(target_os = "windows"))'.dependencies.workspace]
path = "../workspace"
