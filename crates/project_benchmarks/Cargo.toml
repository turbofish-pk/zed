[package]
name = "project_benchmarks"
version = "0.1.0"

[package.publish]
workspace = true

[package.edition]
workspace = true

[features]
test-support = ["http_client/test-support"]

[[bin]]
name = "project_benchmarks"
path = "src/main.rs"
required-features = ["test-support"]

[dependencies]
rpassword = "7.4"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.askpass]
path = "../askpass"

[dependencies.clap]
version = "4.4"
features = ["derive", "wrap_help"]

[dependencies.client]
path = "../client"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.gpui_platform]
path = "../gpui_platform"
default-features = false

[dependencies.http_client]
path = "../http_client"

[dependencies.language]
path = "../language"

[dependencies.node_runtime]
path = "../node_runtime"

[dependencies.project]
path = "../project"

[dependencies.release_channel]
path = "../release_channel"

[dependencies.remote]
path = "../remote"
features = ["build-remote-server-binary"]

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.settings]
path = "../settings"

[dependencies.watch]
path = "../watch"

[lints]
workspace = true
