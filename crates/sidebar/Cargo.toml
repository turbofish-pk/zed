[package]
name = "sidebar"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/sidebar.rs"
doctest = false

[features]
default = []

[dependencies.acp_thread]
path = "../acp_thread"

[dependencies.action_log]
path = "../action_log"

[dependencies.async-channel]
version = "2.5"
default-features = false

[dependencies.agent]
path = "../agent"

[dependencies.agent-client-protocol]
version = "=3.5.0"
features = ["schemars", "unstable", "unstable_protocol_v2"]

[dependencies.agent_settings]
path = "../agent_settings"

[dependencies.agent_ui]
path = "../agent_ui"
features = ["audio"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.editor]
path = "../editor"

[dependencies.feature_flags]
path = "../feature_flags"

[dependencies.fs]
path = "../fs"

[dependencies.git]
path = "../git"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.itertools]
version = "0.14.0"

[dependencies.language_model]
path = "../language_model"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.menu]
path = "../menu"

[dependencies.notifications]
path = "../notifications"

[dependencies.platform_title_bar]
path = "../platform_title_bar"

[dependencies.project]
path = "../project"

[dependencies.recent_projects]
path = "../recent_projects"

[dependencies.remote]
path = "../remote"

[dependencies.remote_connection]
path = "../remote_connection"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.telemetry]
path = "../telemetry"

[dependencies.theme]
path = "../theme"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.ui]
path = "../ui"

[dependencies.unicode-segmentation]
version = "1.10"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dependencies.git_ui_core]
path = "../git_ui_core"

[dependencies.zed_actions]
path = "../zed_actions"

[dev-dependencies.acp_thread]
path = "../acp_thread"
features = ["test-support"]

[dev-dependencies.agent]
path = "../agent"
features = ["test-support"]

[dev-dependencies.agent_ui]
path = "../agent_ui"
features = ["test-support"]

[dev-dependencies.editor]
path = "../editor"

[dev-dependencies.extension]
path = "../extension"

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.language_model]
path = "../language_model"
features = ["test-support"]

[dev-dependencies.release_channel]
path = "../release_channel"

[dev-dependencies.semver]
version = "1.0"
features = ["serde"]

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.prompt_store]
path = "../prompt_store"

[dev-dependencies.recent_projects]
path = "../recent_projects"
features = ["test-support"]

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.fs]
path = "../fs"
features = ["test-support"]

[dev-dependencies.git]
path = "../git"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.client]
path = "../client"
features = ["test-support"]

[dev-dependencies.clock]
path = "../clock"
features = ["test-support"]

[dev-dependencies.db]
path = "../db"
features = ["test-support"]

[dev-dependencies.http_client]
path = "../http_client"
features = ["test-support"]

[dev-dependencies.node_runtime]
path = "../node_runtime"
features = ["test-support"]

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.remote]
path = "../remote"
features = ["test-support"]

[dev-dependencies.remote_connection]
path = "../remote_connection"
features = ["test-support"]

[dev-dependencies.remote_server]
path = "../remote_server"
features = ["test-support"]

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]

[dev-dependencies.workspace]
path = "../workspace"
features = ["test-support"]
