[package]
name = "oauth_callback_server"
version = "0.1.0"
publish = false
license = "Apache-2.0"
description = "Loopback OAuth 2.0 callback server and shared HTML response page for Zed sign-in flows"

[package.edition]
workspace = true

[lints]
workspace = true

[lib]
path = "src/oauth_callback_server.rs"
doctest = false
test = false

[dependencies.anyhow]
version = "1.0.86"

[target.'cfg(not(target_family = "wasm"))'.dependencies.futures]
version = "0.3.34"

[target.'cfg(not(target_family = "wasm"))'.dependencies.log]
version = "0.4"
default-features = false
features = ["std", "serde"]

[target.'cfg(not(target_family = "wasm"))'.dependencies.tiny_http]
version = "0.12"

[target.'cfg(not(target_family = "wasm"))'.dependencies.url]
version = "2.2"
