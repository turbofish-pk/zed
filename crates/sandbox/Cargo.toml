[package]
name = "sandbox"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/sandbox.rs"
doctest = false

[features]
nixos-test = ["dep:serde", "dep:serde_json", "http_proxy/nixos-integration-tests"]
wsl-test = []

[[bin]]
name = "bwrap_test_helper"
path = "src/bwrap_test_helper.rs"
required-features = ["nixos-test"]

[[bin]]
name = "wsl_sandbox_test_helper"
path = "src/wsl_sandbox_test_helper.rs"
required-features = ["wsl-test"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.futures]
version = "0.3.34"

[dependencies.http_proxy]
path = "../http_proxy"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.serde]
version = "1.0"
features = ["rc", "derive"]
optional = true

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]
optional = true

[target.'cfg(target_os = "linux")'.dependencies.libc]
version = "0.2"

[target.'cfg(target_os = "linux")'.dependencies.nix]
version = "0.30"
features = ["fs", "socket", "uio"]

[target.'cfg(target_os = "linux")'.dependencies.seccompiler]
version = "0.5"

[target.'cfg(target_os = "linux")'.dev-dependencies.tempfile]
version = "3.20.0"

[target.'cfg(target_os = "linux")'.dev-dependencies.gpui]
path = "../gpui"
default-features = false


[target.'cfg(target_os = "macos")'.dependencies.tempfile]
version = "3.20.0"
