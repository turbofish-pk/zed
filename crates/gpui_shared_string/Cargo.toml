[package]
name = "gpui_shared_string"
version = "0.1.0"
license = "Apache-2.0"

[package.publish]
workspace = true

[package.edition]
workspace = true

[lib]
path = "gpui_shared_string.rs"
test = false
doctest = false

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.smol_str]
version = "0.3.6"
default-features = false
features = ["serde"]

[lints]
workspace = true
