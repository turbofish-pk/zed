[package]
name = "multi_buffer"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["tracing"]

[lints]
workspace = true

[lib]
path = "src/multi_buffer.rs"
doctest = false

[features]
test-support = ["buffer_diff/test-support", "gpui/test-support", "language/test-support", "text/test-support", "util/test-support"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.clock]
path = "../clock"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.ctor]
version = "1.0.12"

[dependencies.futures-lite]
version = "2"

[dependencies.buffer_diff]
path = "../buffer_diff"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.itertools]
version = "0.14.0"

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dependencies.rope]
path = "../rope"

[dependencies.settings]
path = "../settings"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.sum_tree]
path = "../sum_tree"

[dependencies.text]
path = "../text"

[dependencies.theme]
path = "../theme"

[dependencies.tree-sitter]
git = "https://github.com/tree-sitter/tree-sitter"
rev = "803c6ebaac27d69e1808b45058482e868d073ceb"
features = ["wasm"]

[dependencies.ztracing]
path = "../ztracing"

[dependencies.tracing]
version = "0.1.40"

[dependencies.util]
path = "../util"

[dependencies.unicode-segmentation]
version = "1.10"

[dev-dependencies.buffer_diff]
path = "../buffer_diff"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.indoc]
version = "2"

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.proptest]
version = "1.12.0"
features = ["attr-macro"]

[dev-dependencies.proptest-derive]
version = "0.8.0"

[dev-dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]

[dev-dependencies.text]
path = "../text"
features = ["test-support"]

[dev-dependencies.util]
path = "../util"
features = ["test-support"]

[dev-dependencies.zlog]
path = "../zlog"
