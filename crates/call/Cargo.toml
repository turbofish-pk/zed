[package]
name = "call"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/call.rs"
doctest = false

[features]
test-support = ["client/test-support", "collections/test-support", "gpui/test-support", "livekit_client/test-support", "project/test-support", "util/test-support", "workspace/test-support"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.audio]
path = "../audio"

[dependencies.client]
path = "../client"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.feature_flags]
path = "../feature_flags"

[dependencies.gpui]
path = "../gpui"
default-features = false
features = ["screen-capture"]

[dependencies.gpui_tokio]
path = "../gpui_tokio"

[dependencies.language]
path = "../language"

[dependencies.livekit_client]
path = "../livekit_client"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.postage]
version = "0.5"
default-features = false

[dependencies.project]
path = "../project"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.settings]
path = "../settings"

[dependencies.telemetry]
path = "../telemetry"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dev-dependencies.client]
path = "../client"
features = ["test-support"]

[dev-dependencies.collections]
path = "../collections"
version = "0.1.0"
features = ["test-support"]

[dev-dependencies.fs]
path = "../fs"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.util]
path = "../util"
features = ["test-support"]

[dev-dependencies.workspace]
path = "../workspace"
features = ["test-support"]

[dev-dependencies.livekit_client]
path = "../livekit_client"
features = ["test-support"]
