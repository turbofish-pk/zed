[package]
name = "session"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/session.rs"
doctest = false

[features]


[dependencies.db]
path = "../db"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.uuid]
version = "1.1"
features = ["serde"]

[dependencies.util]
path = "../util"

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]
