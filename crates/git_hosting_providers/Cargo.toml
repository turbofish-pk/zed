[package]
name = "git_hosting_providers"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/git_hosting_providers.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-trait]
version = "0.1"

[dependencies.futures]
version = "0.3.34"

[dependencies.git]
path = "../git"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.http_client]
path = "../http_client"

[dependencies.itertools]
version = "0.14.0"

[dependencies.regex]
version = "1.5"
default-features = false
features = ["std", "perf"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.url]
version = "2.2"

[dependencies.urlencoding]
version = "2.1.2"

[dependencies.util]
path = "../util"
