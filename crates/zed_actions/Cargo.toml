[package]
name = "zed_actions"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["util"]

[lints]
workspace = true

[lib]
test = false
doctest = false

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.util]
path = "../util"
