[package]
name = "git"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/git.rs"
doctest = false

[features]
test-support = ["rand", "gpui/test-support"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.askpass]
path = "../askpass"

[dependencies.async-trait]
version = "0.1"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.derive_more]
version = "2.1"
features = ["deref", "deref_mut", "from_str"]

[dependencies.file_content]
path = "../file_content"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.http_client]
path = "../http_client"

[dependencies.itertools]
version = "0.14.0"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.regex]
version = "1.5"
default-features = false
features = ["std", "perf"]

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]
optional = true

[dependencies.rope]
path = "../rope"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.async-channel]
version = "2.5"
default-features = false

[dependencies.smol]
version = "2.0"

[dependencies.sum_tree]
path = "../sum_tree"

[dependencies.text]
path = "../text"

[dependencies.thiserror]
version = "2.0.12"

[dependencies.time]
version = "0.3"
features = ["macros", "parsing", "serde", "serde-well-known", "formatting", "local-offset"]

[dependencies.url]
version = "2.2"

[dependencies.urlencoding]
version = "2.1.2"

[dependencies.util]
path = "../util"

[dependencies.uuid]
version = "1.1"
features = ["serde"]

[dependencies.futures]
version = "0.3.34"

[dependencies.ztracing]
path = "../ztracing"

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.text]
path = "../text"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.tempfile]
version = "3.20.0"

[dev-dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]
