[package]
name = "x_ai"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/x_ai.rs"
test = false
doctest = false

[features]
default = []
schemars = ["dep:schemars"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2", "derive"]
optional = true

[dependencies.serde]
version = "1.0"
features = ["rc", "derive"]

[dependencies.strum]
version = "0.28"
features = ["derive"]
