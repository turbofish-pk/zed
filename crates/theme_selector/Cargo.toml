[package]
name = "theme_selector"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/theme_selector.rs"
doctest = false

[dependencies.fs]
path = "../fs"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.picker]
path = "../picker"

[dependencies.settings]
path = "../settings"

[dependencies.telemetry]
path = "../telemetry"

[dependencies.theme]
path = "../theme"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"

[dev-dependencies.editor]
path = "../editor"
features = ["test-support"]

[dev-dependencies.project]
path = "../project"

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.theme]
path = "../theme"
features = ["test-support"]
