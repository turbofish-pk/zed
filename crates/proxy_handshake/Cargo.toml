[package]
name = "proxy_handshake"
version = "0.1.0"
license = "Apache-2.0"
description = "Sans-IO client handshakes for HTTP CONNECT and SOCKS proxies"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/proxy_handshake.rs"
doctest = true

[features]
default = []
futures-io = ["dep:futures"]
tokio = ["dep:tokio"]

[dependencies.base64]
version = "0.22"

[dependencies.futures]
version = "0.3.34"
optional = true

[dependencies.httparse]
version = "1.10"

[dependencies.percent-encoding]
version = "2.3.2"

[dependencies.thiserror]
version = "2.0.12"

[dependencies.tokio]
version = "1"
features = ["io-util"]
optional = true

[dependencies.url]
version = "2.2"

[dev-dependencies.futures]
version = "0.3.34"

[dev-dependencies.piper]
version = "0.2"

[dev-dependencies.proptest]
version = "1.12.0"
features = ["attr-macro"]

[dev-dependencies.tokio]
version = "1"
features = ["io-util", "macros", "rt"]
