[package]
name = "activity_indicator"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/activity_indicator.rs"
doctest = false
test = false

[features]

[dependencies.anyhow]
version = "1.0.86"



[dependencies.editor]
path = "../editor"

[dependencies.extension_host]
path = "../extension_host"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language]
path = "../language"

[dependencies.project]
path = "../project"

[dependencies.proto]
path = "../proto"

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

