[package]
name = "language_models_cloud"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/language_models_cloud.rs"
doctest = false

[dependencies.anthropic]
path = "../anthropic"
features = ["schemars"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.cloud_api_client]
path = "../cloud_api_client"

[dependencies.cloud_llm_client]
path = "../cloud_llm_client"

[dependencies.futures]
version = "0.3.34"

[dependencies.google_ai]
path = "../google_ai"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.http_client]
path = "../http_client"

[dependencies.language_model]
path = "../language_model"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.open_ai]
path = "../open_ai"
features = ["schemars"]

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.thiserror]
version = "2.0.12"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.http_client]
path = "../http_client"
features = ["test-support"]

[dev-dependencies.language_model]
path = "../language_model"
features = ["test-support"]
