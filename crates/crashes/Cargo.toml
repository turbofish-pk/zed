[package]
name = "crashes"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.publish]
workspace = true

[package.edition]
workspace = true

[dependencies.crash-handler]
version = "0.8"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.minidumper]
version = "0.11"

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.system_specs]
path = "../system_specs"

[dependencies.zstd]
version = "0.13"
default-features = false
features = ["legacy", "arrays"]

[target.'cfg(not(target_os = "windows"))'.dependencies.async-process]
version = "2.5.0"

[target.'cfg(target_os = "linux")'.dependencies.libc]
version = "0.2"

[target.'cfg(target_os = "macos")'.dependencies.mach2]
version = "0.6"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"]

[lints]
workspace = true

[lib]
path = "src/crashes.rs"
doctest = false
