[package]
name = "miniprofiler_ui"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.publish]
workspace = true

[package.edition]
workspace = true

[lints]
workspace = true

[lib]
path = "src/miniprofiler_ui.rs"
test = false
doctest = false

[dependencies.command_palette_hooks]
path = "../command_palette_hooks"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.rpc]
path = "../rpc"

[dependencies.settings]
path = "../settings"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.zed_actions]
path = "../zed_actions"

[dependencies.workspace]
path = "../workspace"

[dependencies.util]
path = "../util"

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.smol]
version = "2.0"
