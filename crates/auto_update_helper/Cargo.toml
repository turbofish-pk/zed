[package]
name = "auto_update_helper"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]

[lints]
workspace = true

[[bin]]
name = "auto_update_helper"
path = "src/auto_update_helper.rs"
doctest = false

[target.'cfg(target_os = "windows")'.dependencies]
scopeguard = "1.2"

[target.'cfg(target_os = "windows")'.dependencies.anyhow]
version = "1.0.86"

[target.'cfg(target_os = "windows")'.dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[target.'cfg(target_os = "windows")'.dependencies.simplelog]
version = "0.12"
default-features = false

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_RestartManager", "Win32_UI_Controls"]

[target.'cfg(target_os = "windows")'.dev-dependencies.tempfile]
version = "3.20.0"

[target.'cfg(target_os = "windows")'.build-dependencies.windows_resources]
path = "../windows_resources"
