[package]
name = "ui"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["log"]

[lints]
workspace = true

[lib]
name = "ui"
path = "src/ui.rs"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.component]
path = "../component"

[dependencies.documented]
version = "0.10"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.gpui_macros]
path = "../gpui_macros"

[dependencies.icons]
path = "../icons"

[dependencies.itertools]
version = "0.14.0"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.menu]
path = "../menu"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.theme]
path = "../theme"

[dependencies.ui_macros]
path = "../ui_macros"

[dependencies.web-time]
version = "1.1.0"

[dependencies.gpui_util]
path = "../gpui_util"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]

[dev-dependencies.theme_settings]
path = "../theme_settings"

[features]
default = []
