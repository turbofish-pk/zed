[package]
name = "cloud_llm_client"
version = "0.1.0"
license = "Apache-2.0"

[package.publish]
workspace = true

[package.edition]
workspace = true

[features]
test-support = []
predict-edits = ["dep:zeta_prompt"]

[lints]
workspace = true

[lib]
path = "src/cloud_llm_client.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.serde]
version = "1.0"
features = ["rc", "derive"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.uuid]
version = "1.1"
features = ["serde"]

[dependencies.zeta_prompt]
path = "../zeta_prompt"
optional = true
