[package]
name = "codestral"
version = "0.1.0"
publish = false
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[lib]
path = "src/codestral.rs"
test = false
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.edit_prediction_types]
path = "../edit_prediction_types"

[dependencies.edit_prediction]
path = "../edit_prediction"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.http_client]
path = "../http_client"

[dependencies.icons]
path = "../icons"

[dependencies.language]
path = "../language"

[dependencies.language_model]
path = "../language_model"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.text]
path = "../text"

[dependencies.zed_credentials_provider]
path = "../zed_credentials_provider"

[dependencies.zeta_prompt]
path = "../zeta_prompt"
