[package]
name = "openai_subscribed"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/openai_subscribed.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.base64]
version = "0.22"

[dependencies.credentials_provider]
path = "../credentials_provider"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.gpui_util]
path = "../gpui_util"

[dependencies.http_client]
path = "../http_client"

[dependencies.language_model]
path = "../language_model"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.oauth_callback_server]
path = "../oauth_callback_server"

[dependencies.open_ai]
path = "../open_ai"

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.sha2]
version = "0.10"

[dependencies.smol]
version = "2.0"

[dependencies.url]
version = "2.2"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.http_client]
path = "../http_client"
features = ["test-support"]

[dev-dependencies.parking_lot]
version = "0.12.1"
