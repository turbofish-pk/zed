[package]
name = "git_ui"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["component", "remote_connection", "tracing"]

[lints]
workspace = true

[lib]
name = "git_ui"
path = "src/git_ui.rs"
doctest = false

[features]
test-support = ["multi_buffer/test-support", "remote_connection/test-support"]
call = ["dep:call"]

[dependencies.agent_settings]
path = "../agent_settings"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.askpass]
path = "../askpass"

[dependencies.async-channel]
version = "2.5"
default-features = false

[dependencies.buffer_diff]
path = "../buffer_diff"

[dependencies.call]
path = "../call"
optional = true

[dependencies.client]
path = "../client"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.component]
path = "../component"

[dependencies.db]
path = "../db"

[dependencies.editor]
path = "../editor"

[dependencies.file_icons]
path = "../file_icons"

[dependencies.futures-lite]
version = "2"

[dependencies.futures]
version = "0.3.34"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.fuzzy_nucleo]
path = "../fuzzy_nucleo"

[dependencies.git]
path = "../git"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.itertools]
version = "0.14.0"

[dependencies.language]
path = "../language"

[dependencies.language_model]
path = "../language_model"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.markdown]
path = "../markdown"

[dependencies.menu]
path = "../menu"

[dependencies.multi_buffer]
path = "../multi_buffer"

[dependencies.notifications]
path = "../notifications"

[dependencies.picker]
path = "../picker"

[dependencies.project]
path = "../project"

[dependencies.prompt_store]
path = "../prompt_store"

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dependencies.release_channel]
path = "../release_channel"

[dependencies.remote_connection]
path = "../remote_connection"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.sysinfo]
version = "0.39"
default-features = false
features = ["system"]

[dependencies.task]
path = "../task"

[dependencies.telemetry]
path = "../telemetry"

[dependencies.terminal]
path = "../terminal"

[dependencies.theme]
path = "../theme"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.time]
version = "0.3"
features = ["macros", "parsing", "serde", "serde-well-known", "formatting", "local-offset"]

[dependencies.time_format]
path = "../time_format"

[dependencies.tracing]
version = "0.1.40"

[dependencies.ui]
path = "../ui"

[dependencies.ui_input]
path = "../ui_input"

[dependencies.util]
path = "../util"

[dependencies.watch]
path = "../watch"

[dependencies.workspace]
path = "../workspace"

[dependencies.git_ui_core]
path = "../git_ui_core"

[dependencies.zed_actions]
path = "../zed_actions"

[dependencies.ztracing]
path = "../ztracing"

[dev-dependencies.ctor]
version = "1.0.12"

[dev-dependencies.db]
path = "../db"
features = ["test-support"]

[dev-dependencies.editor]
path = "../editor"
features = ["test-support"]

[dev-dependencies.fs]
path = "../fs"
features = ["test-support"]

[dev-dependencies.git]
path = "../git"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.indoc]
version = "2"

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dev-dependencies.remote_connection]
path = "../remote_connection"
features = ["test-support"]

[dev-dependencies.search]
path = "../search"

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]

[dev-dependencies.task]
path = "../task"

[dev-dependencies.tree-sitter-md]
git = "https://github.com/zed-industries/tree-sitter-markdown"
rev = "b596e737286780d7bfa9fcddceaeeb754574b352"

[dev-dependencies.unindent]
version = "0.2.0"

[dev-dependencies.workspace]
path = "../workspace"
features = ["test-support"]

[dev-dependencies.zlog]
path = "../zlog"
