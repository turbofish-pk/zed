[package]
name = "web_search_providers"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/web_search_providers.rs"
test = false
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.client]
path = "../client"

[dependencies.cloud_api_client]
path = "../cloud_api_client"

[dependencies.cloud_api_types]
path = "../cloud_api_types"

[dependencies.cloud_llm_client]
path = "../cloud_llm_client"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.http_client]
path = "../http_client"

[dependencies.language_model]
path = "../language_model"

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.web_search]
path = "../web_search"
