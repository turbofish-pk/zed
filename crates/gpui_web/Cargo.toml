[package]
name = "gpui_web"
version = "0.1.0"
license = "Apache-2.0"
autoexamples = false

[package.publish]
workspace = true

[package.edition]
workspace = true

[package.metadata.cargo-shear]
ignored = ["scheduler"]

[lints]
workspace = true

[features]
default = ["multithreaded"]
multithreaded = ["dep:wasm_thread", "scheduler/wasm-threads"]

[lib]
path = "src/gpui_web.rs"
doctest = false

[dependencies]
unicode-properties = "=0.1.3"

[dependencies.unicode-script]
version = "0.5.7"

[dependencies.unicode-segmentation]
version = "1.10"

[target.'cfg(target_family = "wasm")'.dependencies.gpui]
path = "../gpui"
default-features = false

[target.'cfg(target_family = "wasm")'.dependencies.scheduler]
path = "../scheduler"

[target.'cfg(target_family = "wasm")'.dependencies.parking_lot]
version = "0.12.1"
features = ["nightly"]

[target.'cfg(target_family = "wasm")'.dependencies.gpui_wgpu]
path = "../gpui_wgpu"

[target.'cfg(target_family = "wasm")'.dependencies.http_client]
path = "../http_client"

[target.'cfg(target_family = "wasm")'.dependencies.anyhow]
version = "1.0.86"

[target.'cfg(target_family = "wasm")'.dependencies.async-channel]
version = "2.5"
default-features = false

[target.'cfg(target_family = "wasm")'.dependencies.futures]
version = "0.3.34"

[target.'cfg(target_family = "wasm")'.dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[target.'cfg(target_family = "wasm")'.dependencies.uuid]
version = "1.1"
features = ["serde"]

[target.'cfg(target_family = "wasm")'.dependencies.wasm-bindgen]
version = "0.2.120"

[target.'cfg(target_family = "wasm")'.dependencies.wasm-bindgen-futures]
version = "0.4"

[target.'cfg(target_family = "wasm")'.dependencies.web-time]
version = "1.1.0"

[target.'cfg(target_family = "wasm")'.dependencies.console_error_panic_hook]
version = "0.1.7"

[target.'cfg(target_family = "wasm")'.dependencies.js-sys]
version = "0.3"

[target.'cfg(target_family = "wasm")'.dependencies.raw-window-handle]
version = "0.6"

[target.'cfg(target_family = "wasm")'.dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[target.'cfg(target_family = "wasm")'.dependencies.wasm_thread]
git = "https://github.com/zed-industries/wasm_thread"
rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937"
version = "0.3"
features = ["es_modules"]
optional = true

[target.'cfg(target_family = "wasm")'.dependencies.web-sys]
version = "0.3"
features = ["console", "Blob", "Clipboard", "ClipboardEvent", "ClipboardItem", "CompositionEvent", "CssStyleDeclaration", "DataTransfer", "DataTransferItem", "DataTransferItemList", "Document", "DomRect", "DragEvent", "Element", "EventTarget", "File", "FocusOptions", "HtmlCanvasElement", "HtmlElement", "HtmlTextAreaElement", "IdleDeadline", "IdleRequestOptions", "ImageData", "InputEvent", "KeyboardEvent", "Location", "MediaQueryList", "MouseEvent", "Navigator", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "PointerEvent", "ReadableStream", "ReadableStreamDefaultReader", "ReadableStreamReadResult", "ResizeObserver", "ResizeObserverBoxOptions", "ResizeObserverEntry", "ResizeObserverSize", "ResizeObserverOptions", "Screen", "Storage", "TextMetrics", "VisualViewport", "Headers", "Request", "RequestCredentials", "RequestInit", "RequestRedirect", "Response", "WheelEvent", "Window"]

[dev-dependencies.anyhow]
version = "1.0.86"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false

[dev-dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]
