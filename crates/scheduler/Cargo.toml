[package]
name = "scheduler"
version = "0.1.0"
license = "Apache-2.0"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/scheduler.rs"
doctest = false

[features]
test-support = []
wasm-threads = ["dep:wasm_thread", "flume/spin"]

[dependencies.async-task]
version = "4.7"

[dependencies.backtrace]
version = "0.3"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde", "now", "wasmbind"]

[dependencies.flume]
version = "0.12"
default-features = false
features = ["async"]

[dependencies.futures]
version = "0.3.34"

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dependencies.web-time]
version = "1.1.0"

[target.'cfg(target_family = "wasm")'.dependencies.wasm_thread]
git = "https://github.com/zed-industries/wasm_thread"
rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937"
version = "0.3"
features = ["es_modules"]
optional = true
