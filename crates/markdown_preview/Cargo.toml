[package]
name = "markdown_preview"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/markdown_preview.rs"
doctest = false

[features]


[dependencies.anyhow]
version = "1.0.86"

[dependencies.db]
path = "../db"

[dependencies.editor]
path = "../editor"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.markdown]
path = "../markdown"

[dependencies.project]
path = "../project"

[dependencies.settings]
path = "../settings"

[dependencies.theme]
path = "../theme"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.ui]
path = "../ui"

[dependencies.urlencoding]
version = "2.1.2"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"

[dev-dependencies.buffer_diff]
path = "../buffer_diff"

[dev-dependencies.db]
path = "../db"


[dev-dependencies.editor]
path = "../editor"


[dev-dependencies.fs]
path = "../fs"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false


[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.workspace]
path = "../workspace"
