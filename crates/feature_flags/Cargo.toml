[package]
name = "feature_flags"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/feature_flags.rs"
doctest = false

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.feature_flags_macros]
path = "../feature_flags_macros"

[dependencies.fs]
path = "../fs"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.inventory]
version = "0.3.19"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"
