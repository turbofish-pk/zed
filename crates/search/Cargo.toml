[package]
name = "search"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[features]


[lints]
workspace = true

[lib]
path = "src/search.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.any_vec]
version = "0.14"

[dependencies.bitflags]
version = "2.6.0"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.db]
path = "../db"

[dependencies.editor]
path = "../editor"

[dependencies.file_icons]
path = "../file_icons"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.menu]
path = "../menu"

[dependencies.multi_buffer]
path = "../multi_buffer"

[dependencies.picker]
path = "../picker"

[dependencies.picker_preview]
path = "../picker_preview"

[dependencies.project]
path = "../project"

[dependencies.regex]
version = "1.5"
default-features = false
features = ["std", "perf"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.smol]
version = "2.0"

[dependencies.text]
path = "../text"

[dependencies.theme]
path = "../theme"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"

[dependencies.itertools]
version = "0.14.0"

[dependencies.ztracing]
path = "../ztracing"

[dependencies.tracing]
version = "0.1.40"

[dev-dependencies.editor]
path = "../editor"


[dev-dependencies.gpui]
path = "../gpui"
default-features = false


[dev-dependencies.language]
path = "../language"


[dev-dependencies.lsp]
path = "../lsp"

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.proto]
path = "../proto"

[dev-dependencies.unindent]
version = "0.2.0"

[dev-dependencies.util_macros]
path = "../util_macros"

[dev-dependencies.workspace]
path = "../workspace"
