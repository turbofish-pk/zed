[package]
name = "aws_http_client"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/aws_http_client.rs"
test = false
doctest = false

[features]
default = []

[dependencies.aws-smithy-runtime-api]
version = "1.9.2"
features = ["http-1x", "client"]

[dependencies.aws-smithy-types]
version = "1.3.4"
features = ["http-body-1-x"]

[dependencies.http_client]
path = "../http_client"
