[package]
name = "etw_tracing"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lib]
path = "etw_tracing.rs"
test = false
doctest = false

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.61"

[target.'cfg(target_os = "windows")'.dependencies.anyhow]
version = "1.0.86"

[target.'cfg(target_os = "windows")'.dependencies.gpui]
path = "../gpui"
default-features = false

[target.'cfg(target_os = "windows")'.dependencies.net]
path = "../net"

[target.'cfg(target_os = "windows")'.dependencies.serde]
version = "1.0"
features = ["rc"]

[target.'cfg(target_os = "windows")'.dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[target.'cfg(target_os = "windows")'.dependencies.util]
path = "../util"

[target.'cfg(target_os = "windows")'.dependencies.workspace]
path = "../workspace"

[target.'cfg(target_os = "windows")'.dependencies.wprcontrol]
git = "https://github.com/zed-industries/wprcontrol"
rev = "cd811f7"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.61"
features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"]
