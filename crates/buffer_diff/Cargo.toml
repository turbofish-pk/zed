[package]
name = "buffer_diff"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["tracing"]

[lints]
workspace = true

[lib]
path = "src/buffer_diff.rs"
doctest = false

[features]


[dependencies.clock]
path = "../clock"

[dependencies.imara-diff]
version = "0.2"
default-features = false

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]
optional = true

[dependencies.rope]
path = "../rope"

[dependencies.settings]
path = "../settings"
optional = true

[dependencies.sum_tree]
path = "../sum_tree"

[dependencies.text]
path = "../text"

[dependencies.util]
path = "../util"

[dependencies.ztracing]
path = "../ztracing"

