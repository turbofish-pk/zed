[package]
name = "buffer_diff"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["tracing"]

[lints]
workspace = true

[lib]
path = "src/buffer_diff.rs"
doctest = false

[features]
test-support = ["settings", "dep:pretty_assertions"]

[dependencies.clock]
path = "../clock"

[dependencies.imara-diff]
version = "0.2"
default-features = false

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]
optional = true

[dependencies.rope]
path = "../rope"

[dependencies.settings]
path = "../settings"
optional = true

[dependencies.sum_tree]
path = "../sum_tree"

[dependencies.text]
path = "../text"

[dependencies.tracing]
version = "0.1.40"

[dependencies.util]
path = "../util"

[dependencies.ztracing]
path = "../ztracing"

[dev-dependencies.ctor]
version = "1.0.12"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dev-dependencies.settings]
path = "../settings"

[dev-dependencies.text]
path = "../text"
features = ["test-support"]

[dev-dependencies.unindent]
version = "0.2.0"

[dev-dependencies.zlog]
path = "../zlog"
