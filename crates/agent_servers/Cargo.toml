[package]
name = "agent_servers"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[features]
test-support = ["acp_thread/test-support", "gpui/test-support", "project/test-support", "dep:env_logger", "client/test-support", "dep:gpui_tokio", "reqwest_client/test-support", "dep:indoc", "dep:tempfile"]
e2e = []

[lints]
workspace = true

[lib]
path = "src/agent_servers.rs"
doctest = false

[dependencies.acp_thread]
path = "../acp_thread"

[dependencies.action_log]
path = "../action_log"

[dependencies.async-channel]
version = "2.5"
default-features = false

[dependencies.agent-client-protocol]
version = "=3.5.0"
features = ["schemars", "unstable", "unstable_protocol_v2"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.base64]
version = "0.22"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.client]
path = "../client"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.env_logger]
version = "0.11"
optional = true

[dependencies.feature_flags]
path = "../feature_flags"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.gpui_tokio]
path = "../gpui_tokio"
optional = true

[dependencies.http_client]
path = "../http_client"

[dependencies.indoc]
version = "2"
optional = true

[dependencies.language_model]
path = "../language_model"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.project]
path = "../project"

[dependencies.release_channel]
path = "../release_channel"

[dependencies.remote]
path = "../remote"

[dependencies.reqwest_client]
path = "../reqwest_client"
optional = true

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.task]
path = "../task"

[dependencies.tempfile]
version = "3.20.0"
optional = true

[dependencies.thiserror]
version = "2.0.12"

[dependencies.ui]
path = "../ui"

[dependencies.terminal]
path = "../terminal"

[dependencies.uuid]
version = "1.1"
features = ["serde"]

[dependencies.util]
path = "../util"

[dependencies.watch]
path = "../watch"

[dependencies.zed_credentials_provider]
path = "../zed_credentials_provider"

[dev-dependencies.client]
path = "../client"
features = ["test-support"]

[dev-dependencies.env_logger]
version = "0.11"

[dev-dependencies.fs]
path = "../fs"

[dev-dependencies.indoc]
version = "2"

[dev-dependencies.acp_thread]
path = "../acp_thread"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.gpui_tokio]
path = "../gpui_tokio"

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.reqwest_client]
path = "../reqwest_client"
features = ["test-support"]

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]

[dev-dependencies.tempfile]
version = "3.20.0"
