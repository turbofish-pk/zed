[package]
name = "open_path_prompt"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.publish]
workspace = true

[package.edition]
workspace = true

[dependencies.file_icons]
path = "../file_icons"

[dependencies.futures]
version = "0.3.34"

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.picker]
path = "../picker"

[dependencies.project]
path = "../project"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.settings]
path = "../settings"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dev-dependencies.editor]
path = "../editor"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.theme]
path = "../theme"
features = ["test-support"]

[dev-dependencies.theme_settings]
path = "../theme_settings"

[dev-dependencies.workspace]
path = "../workspace"
features = ["test-support"]

[lints]
workspace = true

[lib]
path = "src/open_path_prompt.rs"
doctest = false
