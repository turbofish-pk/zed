[package]
name = "path"
version = "0.1.0"
license = "Apache-2.0"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lib]
path = "src/path.rs"
doctest = false

[features]
test-support = []

[dependencies.anyhow]
version = "1.0.86"

[dependencies.dunce]
version = "1.0"

[dependencies.serde]
version = "1.0"
features = ["rc", "derive"]
optional = true

[target."cfg(windows)".dependencies.tendril]
version = "0.5"

[dev-dependencies.tempfile]
version = "3.20.0"

[lints]
workspace = true
