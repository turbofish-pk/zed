[package]
description = "Shared protocol for communication between the Zed app and the zed.dev server"
name = "proto"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[features]
test-support = []

[lints]
workspace = true

[lib]
path = "src/proto.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.prost]
version = "0.14"

[dependencies.serde]
version = "1.0"
features = ["rc", "derive"]

[build-dependencies.prost-build]
version = "0.14"
default-features = false

[build-dependencies.protox]
version = "0.9"

[dev-dependencies]
