[package]
name = "agent_settings"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/agent_settings.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.convert_case]
version = "0.11.0"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language_model]
path = "../language_model"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.paths]
path = "../paths"

[dependencies.project]
path = "../project"

[dependencies.regex]
version = "1.5"
default-features = false
features = ["std", "perf"]

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.settings]
path = "../settings"

[dependencies.util]
path = "../util"

[dev-dependencies.fs]
path = "../fs"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.serde_json_lenient]
version = "0.2"
features = ["preserve_order", "raw_value"]

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]
