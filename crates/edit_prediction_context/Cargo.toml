[package]
name = "edit_prediction_context"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/edit_prediction_context.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.clock]
path = "../clock"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language]
path = "../language"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.lsp]
path = "../lsp"

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.project]
path = "../project"

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.telemetry]
path = "../telemetry"

[dependencies.text]
path = "../text"

[dependencies.tree-sitter]
git = "https://github.com/tree-sitter/tree-sitter"
rev = "803c6ebaac27d69e1808b45058482e868d073ceb"
features = ["wasm"]

[dependencies.util]
path = "../util"

[dependencies.zeta_prompt]
path = "../zeta_prompt"

[dev-dependencies.env_logger]
version = "0.11"

[dev-dependencies.indoc]
version = "2"

[dev-dependencies.futures]
version = "0.3.34"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.lsp]
path = "../lsp"
features = ["test-support"]

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]

[dev-dependencies.text]
path = "../text"
features = ["test-support"]

[dev-dependencies.util]
path = "../util"
features = ["test-support"]
