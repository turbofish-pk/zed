[package]
name = "fuzzy_nucleo"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["parking_lot"]

[lints]
workspace = true

[lib]
path = "src/fuzzy_nucleo.rs"
doctest = false

[dependencies.fuzzy]
path = "../fuzzy"

[dependencies.nucleo]
package = "nucleo-matcher"
version = "0.3"

[dependencies.parking_lot]
version = "0.12.1"
features = ["arc_lock", "send_guard"]

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.gpui_util]
path = "../gpui_util"

[dependencies.path]
path = "../path"

[dev-dependencies.criterion]
version = "0.8.2"
features = ["html_reports"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[[bench]]
name = "match_benchmark"
harness = false
