[package]
name = "mermaid_render"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["tracing"]

[lints]
workspace = true

[lib]
path = "src/mermaid_render.rs"
doctest = false

[features]


[dependencies.anyhow]
version = "1.0.86"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.merman]
version = "=0.8.0-alpha.5"
default-features = false
features = ["layout-cytoscape", "svg"]

[dependencies.quick-xml]
version = "0.41"

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.ztracing]
path = "../ztracing"

[dev-dependencies.gpui]
path = "../gpui"
default-features = false


[dev-dependencies.mermaid_render]
path = ""


[dev-dependencies.usvg]
version = "0.46.0"
default-features = false
