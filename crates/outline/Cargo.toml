[package]
name = "outline"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/outline.rs"
doctest = false

[dependencies.editor]
path = "../editor"

[dependencies.fuzzy_nucleo]
path = "../fuzzy_nucleo"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.language]
path = "../language"

[dependencies.picker]
path = "../picker"

[dependencies.picker_preview]
path = "../picker_preview"

[dependencies.settings]
path = "../settings"

[dependencies.theme]
path = "../theme"

[dependencies.ui]
path = "../ui"

[dependencies.util]
path = "../util"

[dependencies.workspace]
path = "../workspace"

[dependencies.zed_actions]
path = "../zed_actions"

[dev-dependencies.editor]
path = "../editor"
features = ["test-support"]

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.indoc]
version = "2"

[dev-dependencies.language]
path = "../language"
features = ["test-support"]

[dev-dependencies.lsp]
path = "../lsp"

[dev-dependencies.menu]
path = "../menu"

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.rope]
path = "../rope"

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.settings]
path = "../settings"
features = ["test-support"]

[dev-dependencies.workspace]
path = "../workspace"
features = ["test-support"]

[dev-dependencies.futures]
version = "0.3.34"
