[package]
name = "cloud_api_client"
version = "0.1.0"
license = "Apache-2.0"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/cloud_api_client.rs"
doctest = false

[dependencies.anyhow]
version = "1.0.86"

[dependencies.cloud_api_types]
path = "../cloud_api_types"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.http_client]
path = "../http_client"

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.thiserror]
version = "2.0.12"

[dependencies.yawc]
version = "0.4"
default-features = false

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.async-lock]
version = "3.4"
default-features = false

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies.async-lock]
version = "3.4"
default-features = false
features = ["std"]

[target.'cfg(not(target_family = "wasm"))'.dependencies.futures-lite]
version = "2"

[target.'cfg(not(target_family = "wasm"))'.dependencies.gpui_tokio]
path = "../gpui_tokio"

[target.'cfg(not(target_family = "wasm"))'.dependencies.http_client_tls]
path = "../http_client_tls"

[target.'cfg(not(target_family = "wasm"))'.dependencies.tokio-rustls]
version = "0.26"
default-features = false
