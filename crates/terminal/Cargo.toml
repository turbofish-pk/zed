[package]
name = "terminal"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[features]


[lints]
workspace = true

[lib]
path = "src/terminal.rs"
doctest = false

[dependencies.async-channel]
version = "2.5"
default-features = false

[dependencies.alacritty_terminal]
git = "https://github.com/zed-industries/alacritty"
rev = "4c129667ce56611becdc82de6e28218c80e2e88f"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.futures]
version = "0.3.34"

[dependencies.futures-lite]
version = "2"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.itertools]
version = "0.14.0"

[dependencies.libc]
version = "0.2"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.regex]
version = "1.5"
default-features = false
features = ["std", "perf"]

[dependencies.release_channel]
path = "../release_channel"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.settings]
path = "../settings"

[dependencies.sysinfo]
version = "0.39"
default-features = false
features = ["system"]

[dependencies.task]
path = "../task"

[dependencies.theme]
path = "../theme"

[dependencies.theme_settings]
path = "../theme_settings"

[dependencies.thiserror]
version = "2.0.12"

[dependencies.url]
version = "2.2"

[dependencies.util]
path = "../util"

[dependencies.urlencoding]
version = "2.1.2"

[dependencies.vte]
version = "0.15.0"
features = ["ansi"]

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.percent-encoding]
version = "2.3.2"
