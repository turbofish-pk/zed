[package]
name = "language_model_core"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
path = "src/language_model_core.rs"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.cloud_llm_client]
path = "../cloud_llm_client"

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui_shared_string]
path = "../gpui_shared_string"

[dependencies.http]
version = "1.1"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.partial-json-fixer]
version = "0.5.3"

[dependencies.schemars]
version = "1.0"
default-features = false
features = ["std", "indexmap2", "derive"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.thiserror]
version = "2.0.12"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.async-lock]
version = "3.4"
default-features = false

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies.async-lock]
version = "3.4"
default-features = false
features = ["std"]

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]
