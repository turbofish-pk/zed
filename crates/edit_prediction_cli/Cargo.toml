[package]
name = "edit_prediction_cli"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[package.metadata.cargo-shear]
ignored = ["wasmtime", "workspace"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ep"
path = "src/main.rs"

[dependencies]
clap = "4"
flate2 = "1.1.8"
gaoya = "0.2.0"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.anthropic]
path = "../anthropic"

[dependencies.http_client]
path = "../http_client"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std", "serde"]

[dependencies.client]
path = "../client"

[dependencies.cloud_llm_client]
path = "../cloud_llm_client"
features = ["predict-edits"]

[dependencies.collections]
path = "../collections"
version = "0.1.0"

[dependencies.db]
path = "../db"

[dependencies.debug_adapter_extension]
path = "../debug_adapter_extension"

[dependencies.dirs]
version = "6.0"

[dependencies.extension]
path = "../extension"

[dependencies.fs]
path = "../fs"

[dependencies.futures]
version = "0.3.34"

[dependencies.gpui]
path = "../gpui"
default-features = false

[dependencies.gpui_platform]
path = "../gpui_platform"
default-features = false

[dependencies.gpui_tokio]
path = "../gpui_tokio"

[dependencies.indoc]
version = "2"

[dependencies.language]
path = "../language"

[dependencies.language_extension]
path = "../language_extension"

[dependencies.language_model]
path = "../language_model"

[dependencies.language_models]
path = "../language_models"

[dependencies.languages]
path = "../languages"
features = ["load-grammars"]

[dependencies.libc]
version = "0.2"

[dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dependencies.node_runtime]
path = "../node_runtime"

[dependencies.open_ai]
path = "../open_ai"

[dependencies.paths]
path = "../paths"

[dependencies.project]
path = "../project"

[dependencies.prompt_store]
path = "../prompt_store"

[dependencies.release_channel]
path = "../release_channel"

[dependencies.reqwest_client]
path = "../reqwest_client"

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.settings]
path = "../settings"

[dependencies.shellexpand]
version = "3.1"

[dependencies.smol]
version = "2.0"

[dependencies.sqlez]
path = "../sqlez"

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.sqlez_macros]
path = "../sqlez_macros"

[dependencies.terminal_view]
path = "../terminal_view"

[dependencies.util]
path = "../util"

[dependencies.watch]
path = "../watch"

[dependencies.edit_prediction]
path = "../edit_prediction"
features = ["cli-support"]

[dependencies.edit_prediction_context]
path = "../edit_prediction_context"

[dependencies.edit_prediction_metrics]
path = "../edit_prediction_metrics"
features = ["tree-sitter"]

[dependencies.telemetry_events]
path = "../telemetry_events"

[dependencies.wasmtime]
version = "48.0.7"
default-features = false
features = ["anyhow", "async", "demangle", "runtime", "cranelift", "component-model", "incremental-cache", "parallel-compilation"]

[dependencies.zeta_prompt]
path = "../zeta_prompt"

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "std_rng", "os_rng"]

[dependencies.similar]
version = "2.7"

[dependencies.toml]
version = "0.9"
default-features = false
features = ["std", "serde", "parse"]

[features]
dynamic_prompts = []

[dev-dependencies.gpui]
path = "../gpui"
default-features = false
features = ["test-support"]

[dev-dependencies.indoc]
version = "2"

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.project]
path = "../project"
features = ["test-support"]

[dev-dependencies.tempfile]
version = "3.20.0"

[dev-dependencies.workspace]
path = "../workspace"
features = ["test-support"]
