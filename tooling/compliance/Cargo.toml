[package]
name = "compliance"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
octo-client = ["dep:octocrab", "dep:jsonwebtoken", "dep:serde_json", "dep:tokio"]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-trait]
version = "0.1"

[dependencies.derive_more]
version = "2.1"
features = ["deref", "deref_mut", "from_str", "display"]

[dependencies.futures]
version = "0.3.34"

[dependencies.itertools]
version = "0.14.0"

[dependencies.jsonwebtoken]
version = "10.2"
features = ["use_pem"]
optional = true

[dependencies.octocrab]
version = "0.49"
default-features = false
features = ["default-client", "jwt-aws-lc-rs", "retry", "rustls", "rustls-aws-lc-rs", "stream", "timeout"]
optional = true

[dependencies.regex]
version = "1.5"
default-features = false
features = ["std", "perf"]

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.serde]
version = "1.0"
features = ["rc", "derive"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]
optional = true

[dependencies.tokio]
version = "1"
optional = true

[dev-dependencies.indoc]
version = "2"

[dev-dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dev-dependencies.tokio]
version = "1"
features = ["rt", "macros"]
