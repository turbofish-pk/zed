[package]
name = "xtask"
version = "0.1.0"
license = "GPL-3.0-or-later"

[package.edition]
workspace = true

[package.publish]
workspace = true

[lints]
workspace = true

[dependencies]
annotate-snippets = "0.12.1"
guppy = "0.18"
serde_yaml = "0.9.34"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.backtrace]
version = "0.3"

[dependencies.cargo_metadata]
version = "0.23"

[dependencies.cargo_toml]
version = "0.21"

[dependencies.clap]
version = "4.4"
features = ["derive", "wrap_help"]

[dependencies.compliance]
path = "../compliance"
features = ["octo-client"]

[dependencies.gh-workflow]
git = "https://github.com/zed-industries/gh-workflow"
rev = "37f3c0575d379c218a9c455ee67585184e40d43f"

[dependencies.indoc]
version = "2"

[dependencies.indexmap]
version = "2.7.0"
features = ["serde"]

[dependencies.itertools]
version = "0.14.0"

[dependencies.regex]
version = "1.5"
default-features = false
features = ["std", "perf", "unicode-perl"]

[dependencies.serde]
version = "1.0"
features = ["rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.thiserror]
version = "2.0.12"

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread"]

[dependencies.toml]
version = "0.9"
default-features = false
features = ["std", "serde", "parse"]

[dependencies.toml_edit]
version = "0.22"
default-features = false
features = ["parse"]

[dependencies.url]
version = "2.2"

[dev-dependencies.tempfile]
version = "3.20.0"
